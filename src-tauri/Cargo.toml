[package]
name = "finance-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.89"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
reqwest = { version = "0.12", features = ["json"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio-rustls", "macros", "migrate", "chrono", "uuid", "rust_decimal"] }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2.4.3"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower-http = { version = "0.6.10", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }

# 加密相关
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
keyring = "2.0"
hex = "0.4"
urlencoding = "2.1.3"

[dev-dependencies]
proptest = "1"
