# Clippy自定义配置
# 用于强制执行CODING_STANDARDS.md中的规范

# 禁止的方法调用
disallowed-methods = [
    # 禁止println!（应该用tracing）
    { path = "std::io::_print", reason = "use tracing macros (info!, debug!, error!) instead of println!" },
]

# 禁止的类型
disallowed-types = []

# 要求所有公共API有文档
missing-docs-in-public-items = "warn"

# 要求错误类型实现Error trait
missing-errors-doc = "warn"

# 禁止TODO注释（应该创建issue）
todo = "warn"

# 禁止unwrap（应该正确处理错误）
unwrap-used = "warn"
expect-used = "warn"

# 要求显式返回类型
missing-return-type = "warn"

# 禁止过长的函数
too-many-lines = 100

# 禁止过多的参数
too-many-arguments = 5

# 要求使用Self而不是具体类型名
use-self = "warn"

# 检查未使用的结果
unused-results = "warn"
