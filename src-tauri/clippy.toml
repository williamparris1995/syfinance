# Clippy自定义配置
# 用于强制执行CODING_STANDARDS.md中的规范

# 禁止的方法调用
disallowed-methods = [
    # 禁止println!（应该用tracing）
    { path = "std::io::_print", reason = "use tracing macros (info!, debug!, error!) instead of println!" },
]

# 禁止的类型
disallowed-types = []

# 禁止过多的参数（使用正确的字段名）
too-many-arguments-threshold = 5
