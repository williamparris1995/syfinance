<!DOCTYPE html>
<html>
<head>
    <title>Test Category API</title>
</head>
<body>
    <h1>Test Category API</h1>
    <button onclick="testListCategories()">Test list_categories</button>
    <pre id="result"></pre>
    
    <script>
        async function testListCategories() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Loading...';
            
            try {
                // Use Tauri invoke
                if (window.__TAURI__) {
                    const result = await window.__TAURI__.invoke('list_categories');
                    resultEl.textContent = JSON.stringify(result, null, 2);
                } else {
                    resultEl.textContent = 'Tauri not available';
                }
            } catch (error) {
                resultEl.textContent = 'Error: ' + error;
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
