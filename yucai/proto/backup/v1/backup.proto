syntax = "proto3";

package yucai.backup.v1;

option go_package = "github.com/yucai/server/internal/proto/backup/v1";

import "common/v1/pagination.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service BackupService {
  rpc CreateBackup(CreateBackupRequest) returns (BackupResponse);
  rpc RestoreBackup(RestoreBackupRequest) returns (google.protobuf.Empty);
  // UploadBackup imports an externally-produced BackupEnvelope (R6 offline
  // first: one-way guest → server migration on account binding). The data is
  // a plaintext envelope JSON; the authenticated tenant OVERRIDES the
  // envelope's tenant_id, and the import reuses the hardened purge+import
  // path (R5 D6) with a pre-upload safety backup.
  rpc UploadBackup(UploadBackupRequest) returns (google.protobuf.Empty);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (google.protobuf.Empty);
  // SaveCloudSettings / GetCloudSettings persist per-tenant auto-backup
  // preferences. Despite the legacy "Cloud" name, only auto-backup fields are
  // stored — cloud backup (WebDAV/providers) was removed 2026-07-25. Name kept
  // to minimize churn.
  rpc SaveCloudSettings(SaveCloudSettingsRequest) returns (google.protobuf.Empty);
  rpc GetCloudSettings(google.protobuf.Empty) returns (CloudSettingsResponse);
}

enum BackupProvider {
  BACKUP_PROVIDER_UNSPECIFIED = 0;
  BACKUP_PROVIDER_LOCAL = 1;
}

message BackupDTO {
  string id = 1;
  BackupProvider provider = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string checksum = 5;
  bool encrypted = 6;
  bool auto = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateBackupRequest {
  bool encrypted = 1;
  optional string password = 2;
}

message RestoreBackupRequest {
  string backup_id = 1;
  string password = 2;
}

message UploadBackupRequest {
  // Plaintext BackupEnvelope JSON (transport security via TLS). Reserved
  // password for the encrypted-archive future (feature J); empty = plain.
  bytes data = 1;
  string password = 2;
}

message ListBackupsRequest {
  yucai.common.v1.PageRequest page = 1;
  BackupProvider provider = 2;
}

message ListBackupsResponse {
  repeated BackupDTO backups = 1;
  yucai.common.v1.PageResponse page = 2;
}

message DeleteBackupRequest { string id = 1; }

// CloudSettingsDTO carries per-tenant auto-backup preferences only. Cloud
// backup fields (provider/webdav/oauth) were removed 2026-07-25; name kept.
message CloudSettingsDTO {
  bool auto_backup = 1;
  int32 auto_backup_interval_hours = 2;
}

message SaveCloudSettingsRequest { CloudSettingsDTO settings = 1; }
message CloudSettingsResponse { CloudSettingsDTO settings = 1; }
message BackupResponse { BackupDTO backup = 1; }
