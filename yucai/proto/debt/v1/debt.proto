syntax = "proto3";

package yucai.debt.v1;

option go_package = "github.com/yucai/server/internal/proto/debt/v1";

import "common/v1/pagination.proto";
import "common/v1/recurrence.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service DebtService {
  rpc CreateDebt(CreateDebtRequest) returns (DebtResponse);
  rpc UpdateDebt(UpdateDebtRequest) returns (DebtResponse);
  rpc DeleteDebt(DeleteDebtRequest) returns (google.protobuf.Empty);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  // Google-Calendar-style per-occurrence edit: move ONE unpaid installment to
  // a new date (paid / partially paid / transaction-linked entries are
  // frozen). Server rejects collisions on the target date.
  rpc SetPaymentDate(SetPaymentDateRequest) returns (PaymentEntryResponse);
  // Mark an unpaid installment as already repaid WITHOUT booking a cash
  // transaction — for loans whose early installments were settled before the
  // debt was entered into the app. The entry becomes frozen.
  rpc MarkEntryPaid(MarkEntryPaidRequest) returns (PaymentEntryResponse);
  rpc GetDebt(GetDebtRequest) returns (DebtDetailResponse);
  rpc ListDebts(ListDebtsRequest) returns (ListDebtsResponse);
  rpc GetUpcomingPayments(GetUpcomingPaymentsRequest) returns (ListDebtsResponse);
  rpc GetReceivablesSummary(GetReceivablesSummaryRequest) returns (ReceivablesSummaryResponse);
}

enum AmortizationMethod {
  AMORTIZATION_UNSPECIFIED = 0;
  AMORTIZATION_EQUAL_PRINCIPAL_INTEREST = 1;
  AMORTIZATION_EQUAL_PRINCIPAL = 2;
  AMORTIZATION_LUMP_SUM = 3;
  // 先息后本:每期付息,到期一次还本。
  AMORTIZATION_INTEREST_FIRST = 4;
}

enum DebtType {
  DEBT_TYPE_UNSPECIFIED = 0;
  DEBT_TYPE_BORROWED_IN = 1;
  DEBT_TYPE_BORROWED_OUT = 2;
}

message DebtDTO {
  string id = 1;
  string account_id = 2;
  string counterparty = 3;
  double interest_rate = 4;
  AmortizationMethod amortization_method = 5;
  string start_date = 6;
  string due_date = 7;
  int64 total_principal_cents = 8;
  int64 remaining_principal_cents = 9;
  int64 version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  DebtType debt_type = 13;
  string subtype = 14;
  string contact = 15;
  string contract_ref = 16;
  string collection_account_id = 17;
  string next_payment_date = 18;
  int64 next_payment_amount_cents = 19;
  int32 next_payment_period_no = 20;
  int64 remaining_trend_cents = 21;
  // Recurrence rule (zero values = legacy monthly). billing_day is not
  // used by debt: by-date months anchor the start date.
  yucai.common.v1.RecurrenceCycle cycle = 22;
  int32 interval = 23;     // every N weeks/months/years; <=0 treated as 1
  int32 weekday_mask = 24; // bit0=Monday ... bit6=Sunday; 0 = start-date weekday
  yucai.common.v1.RecurrenceMonthlyMode monthly_mode = 25;
  int32 nth = 26;          // 1-4 = the Nth, 5 = the last (nth-weekday mode)
  // Guarantor (2026-09 user request; both directions, optional free text).
  // Field numbers 27/28 allocated after the recurrence block (22-26).
  string guarantor_name = 27;
  string guarantor_contact = 28; // phone / wechat / ...
  // One-off interest waiver (cents), deducted from the earliest installments'
  // interest at schedule generation; 0 = none.
  int64 interest_waived_cents = 29;
  // Σ unpaid schedule interest (本息口径统计用).
  int64 remaining_interest_cents = 30;
}

message PaymentEntryDTO {
  string id = 1;
  string payment_date = 2;
  int64 principal_cents = 3;
  int64 interest_cents = 4;
  int64 total_cents = 5;
  bool paid = 6;
  int64 paid_cents = 7;
  string transaction_id = 8;
}

message DebtDetailDTO {
  DebtDTO debt = 1;
  repeated PaymentEntryDTO schedule = 2;
}

message CreateDebtRequest {
  string account_id = 1;
  string counterparty = 2;
  double interest_rate = 3;
  AmortizationMethod amortization_method = 4;
  string start_date = 5;
  string due_date = 6;
  int64 total_principal_cents = 7;
  DebtType debt_type = 8;
  string subtype = 9;
  // borrowedOut 双写:借出资金的来源账户(cash asset)。borrowedOut 必填;
  // borrowedIn 忽略(不双写)。空字符串 = 不双写。
  string source_account_id = 10;
  string contact = 11;
  string contract_ref = 12;
  string collection_account_id = 13;
  // Recurrence rule (zero values = legacy monthly; ignored by lump_sum).
  yucai.common.v1.RecurrenceCycle cycle = 14;
  int32 interval = 15;
  int32 weekday_mask = 16;
  yucai.common.v1.RecurrenceMonthlyMode monthly_mode = 17;
  int32 nth = 18;
  // Term input dual mode: >0 = by periods (N periods, due_date derived);
  // ==0 = by due date (default; period count derived from rule + dates).
  int32 term_periods = 19;
  // Guarantor (optional; empty = none). Numbers after recurrence 14-19.
  string guarantor_name = 20;
  string guarantor_contact = 21;
  // One-off interest waiver (cents); must not exceed total interest.
  int64 interest_waived_cents = 22;
}

message UpdateDebtRequest {
  string id = 1;
  string counterparty = 2;
  double interest_rate = 3;
  int64 version = 4;
  string contact = 5;
  string contract_ref = 6;
  string collection_account_id = 7;
  // Schedule-affecting edits (Google-Calendar style): already-recorded
  // entries (paid / paid_cents>0 / transaction set) are frozen; the future
  // schedule is regenerated from the remaining principal.
  AmortizationMethod amortization_method = 8;
  string due_date = 9;     // ignored when term_periods > 0
  int32 term_periods = 10; // >0 = by periods; ==0 = by due date
  yucai.common.v1.RecurrenceCycle cycle = 11;
  int32 interval = 12;
  int32 weekday_mask = 13;
  yucai.common.v1.RecurrenceMonthlyMode monthly_mode = 14;
  int32 nth = 15;
  // Guarantor (optional; empty string clears, same semantics as contact).
  string guarantor_name = 16;
  string guarantor_contact = 17;
  // optional = presence-aware: unset keeps the current waiver, set replaces
  // (0 clears the waiver).
  optional int64 interest_waived_cents = 18;
  // Debt subtype label (plain string, verbatim; same space as
  // CreateDebtRequest.subtype). Empty = keep unchanged: pre-F33 clients do
  // not send the field, so an unconditional replace would wipe it on every
  // legacy edit (F33 NFR-2).
  string subtype = 19;
}

message DeleteDebtRequest { string id = 1; }

message RecordPaymentRequest {
  string debt_id = 1;
  string schedule_entry_id = 2;
  string from_account_id = 3;
}

message RecordPaymentResponse {
  string transaction_id = 1;
  PaymentEntryDTO entry = 2;
}

message SetPaymentDateRequest {
  string debt_id = 1;
  string entry_id = 2;
  // yyyy-MM-dd; must be after the debt start date and free of collision.
  string payment_date = 3;
}

message PaymentEntryResponse { PaymentEntryDTO entry = 1; }

message MarkEntryPaidRequest {
  string debt_id = 1;
  string entry_id = 2;
}

message GetDebtRequest { string id = 1; }

message ListDebtsRequest {
  yucai.common.v1.PageRequest page = 1;
  DebtType type_filter = 2;
}

message ListDebtsResponse {
  repeated DebtDTO debts = 1;
  yucai.common.v1.PageResponse page = 2;
}

message GetUpcomingPaymentsRequest {
  int32 days_ahead = 1;
}

message DebtResponse { DebtDTO debt = 1; }
message DebtDetailResponse { DebtDetailDTO debt = 1; }

message GetReceivablesSummaryRequest {}

message ReceivablesSummaryDTO {
  int64 total_principal_cents = 1;
  int64 total_remaining_cents = 2;
  int64 total_collected_cents = 3;
  int64 pending_interest_cents = 4;
  int32 count = 5;
  int32 overdue_count = 6;
  int64 overdue_amount_cents = 7;
  int64 principal_trend_cents = 8;
  int64 remaining_trend_cents = 9;
  string next_payment_date = 10;
  int64 next_payment_amount_cents = 11;
  string next_payment_counterparty = 12;
  int32 next_payment_period_no = 13;
  // Count of receivables newly created this month (created_at in current month).
  // Drives the "较上月 +¥X · 新增 N 笔" trend line on the list overview.
  int32 new_count_this_month = 14;
}

message ReceivablesSummaryResponse { ReceivablesSummaryDTO summary = 1; }
