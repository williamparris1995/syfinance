syntax = "proto3";

package yucai.debt.v1;

option go_package = "github.com/yucai/server/internal/proto/debt/v1";

import "common/v1/pagination.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service DebtService {
  rpc CreateDebt(CreateDebtRequest) returns (DebtResponse);
  rpc UpdateDebt(UpdateDebtRequest) returns (DebtResponse);
  rpc DeleteDebt(DeleteDebtRequest) returns (google.protobuf.Empty);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  rpc GetDebt(GetDebtRequest) returns (DebtDetailResponse);
  rpc ListDebts(ListDebtsRequest) returns (ListDebtsResponse);
  rpc GetUpcomingPayments(GetUpcomingPaymentsRequest) returns (ListDebtsResponse);
  rpc GetReceivablesSummary(GetReceivablesSummaryRequest) returns (ReceivablesSummaryResponse);
}

enum AmortizationMethod {
  AMORTIZATION_UNSPECIFIED = 0;
  AMORTIZATION_EQUAL_PRINCIPAL_INTEREST = 1;
  AMORTIZATION_EQUAL_PRINCIPAL = 2;
  AMORTIZATION_LUMP_SUM = 3;
}

enum DebtType {
  DEBT_TYPE_UNSPECIFIED = 0;
  DEBT_TYPE_BORROWED_IN = 1;
  DEBT_TYPE_BORROWED_OUT = 2;
}

message DebtDTO {
  string id = 1;
  string account_id = 2;
  string counterparty = 3;
  double interest_rate = 4;
  AmortizationMethod amortization_method = 5;
  string start_date = 6;
  string due_date = 7;
  int64 total_principal_cents = 8;
  int64 remaining_principal_cents = 9;
  int64 version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  DebtType debt_type = 13;
  string subtype = 14;
  string contact = 15;
  string contract_ref = 16;
  string collection_account_id = 17;
  string next_payment_date = 18;
  int64 next_payment_amount_cents = 19;
  int32 next_payment_period_no = 20;
  int64 remaining_trend_cents = 21;
}

message PaymentEntryDTO {
  string id = 1;
  string payment_date = 2;
  int64 principal_cents = 3;
  int64 interest_cents = 4;
  int64 total_cents = 5;
  bool paid = 6;
  int64 paid_cents = 7;
  string transaction_id = 8;
}

message DebtDetailDTO {
  DebtDTO debt = 1;
  repeated PaymentEntryDTO schedule = 2;
}

message CreateDebtRequest {
  string account_id = 1;
  string counterparty = 2;
  double interest_rate = 3;
  AmortizationMethod amortization_method = 4;
  string start_date = 5;
  string due_date = 6;
  int64 total_principal_cents = 7;
  DebtType debt_type = 8;
  string subtype = 9;
  // borrowedOut 双写:借出资金的来源账户(cash asset)。borrowedOut 必填;
  // borrowedIn 忽略(不双写)。空字符串 = 不双写。
  string source_account_id = 10;
  string contact = 11;
  string contract_ref = 12;
  string collection_account_id = 13;
}

message UpdateDebtRequest {
  string id = 1;
  string counterparty = 2;
  double interest_rate = 3;
  int64 version = 4;
  string contact = 5;
  string contract_ref = 6;
  string collection_account_id = 7;
}

message DeleteDebtRequest { string id = 1; }

message RecordPaymentRequest {
  string debt_id = 1;
  string schedule_entry_id = 2;
  string from_account_id = 3;
}

message RecordPaymentResponse {
  string transaction_id = 1;
  PaymentEntryDTO entry = 2;
}

message GetDebtRequest { string id = 1; }

message ListDebtsRequest {
  yucai.common.v1.PageRequest page = 1;
  DebtType type_filter = 2;
}

message ListDebtsResponse {
  repeated DebtDTO debts = 1;
  yucai.common.v1.PageResponse page = 2;
}

message GetUpcomingPaymentsRequest {
  int32 days_ahead = 1;
}

message DebtResponse { DebtDTO debt = 1; }
message DebtDetailResponse { DebtDetailDTO debt = 1; }

message GetReceivablesSummaryRequest {}

message ReceivablesSummaryDTO {
  int64 total_principal_cents = 1;
  int64 total_remaining_cents = 2;
  int64 total_collected_cents = 3;
  int64 pending_interest_cents = 4;
  int32 count = 5;
  int32 overdue_count = 6;
  int64 overdue_amount_cents = 7;
  int64 principal_trend_cents = 8;
  int64 remaining_trend_cents = 9;
  string next_payment_date = 10;
  int64 next_payment_amount_cents = 11;
  string next_payment_counterparty = 12;
  int32 next_payment_period_no = 13;
  // Count of receivables newly created this month (created_at in current month).
  // Drives the "较上月 +¥X · 新增 N 笔" trend line on the list overview.
  int32 new_count_this_month = 14;
}

message ReceivablesSummaryResponse { ReceivablesSummaryDTO summary = 1; }
