# protoc-gen-go 版本以目标 pb.go 头部注释为准(当前 v1.36.12);plugin 经 PATH 解析。
version: v2
inputs:
  - directory: .
    paths:
      - holding/v1/holding.proto
      - sync/v1/sync.proto # F16: targeted regen (same convention as holding — paths listed manually)
plugins:
  - local: protoc-gen-go
    out: ../server/internal/proto
    opt:
      - paths=source_relative
      - "Mholding/v1/holding.proto=github.com/yucai/server/internal/proto/holding/v1;holdingv1"
      - "Msync/v1/sync.proto=github.com/yucai/server/internal/proto/sync/v1;syncv1"
