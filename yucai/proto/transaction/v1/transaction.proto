syntax = "proto3";

package yucai.transaction.v1;

option go_package = "github.com/yucai/server/internal/proto/transaction/v1";

import "common/v1/pagination.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// TransactionService manages double-entry bookkeeping transactions.
service TransactionService {
  rpc RecordTransaction(RecordTransactionRequest) returns (TransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (TransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (TransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (google.protobuf.Empty);
  rpc SimpleIncome(SimpleIncomeRequest) returns (TransactionResponse);
  rpc SimpleExpense(SimpleExpenseRequest) returns (TransactionResponse);
  rpc SimpleTransfer(SimpleTransferRequest) returns (TransactionResponse);
  // TransactionSummary returns a tenant's monthly income/expense summary,
  // optionally scoped to one account (account_detail view), broken down by
  // day and by Income/Expense account (category).
  rpc TransactionSummary(TransactionSummaryRequest) returns (TransactionSummaryResponse);
}

message TransactionDTO {
  string id = 1;
  string transaction_date = 2;
  string description = 3;
  repeated EntryDTO entries = 4;
  int64 version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Optional wall-clock time the transaction occurred (RFC3339, e.g.
  // "2026-06-05T19:20:00Z"). Empty when unset (proto3 default).
  string transaction_time = 8;
}

message EntryDTO {
  string id = 1;
  string account_id = 2;
  string chart_of_account_code = 3;
  int64 debit_cents = 4;
  int64 credit_cents = 5;
  string note = 6;
}

message RecordTransactionRequest {
  string transaction_date = 1;
  string description = 2;
  repeated EntryDTO entries = 3;
  // Optional wall-clock time the transaction occurred (RFC3339). Empty = unset.
  string transaction_time = 4;
}

message GetTransactionRequest {
  string id = 1;
}

message ListTransactionsRequest {
  yucai.common.v1.PageRequest page = 1;
  string account_id = 2;
  string date_from = 3;
  string date_to = 4;
}

message ListTransactionsResponse {
  repeated TransactionDTO transactions = 1;
  yucai.common.v1.PageResponse page = 2;
}

message UpdateTransactionRequest {
  string id = 1;
  string transaction_date = 2;
  string description = 3;
  repeated EntryDTO entries = 4;
  int64 version = 5;
}

message DeleteTransactionRequest {
  string id = 1;
}

// Convenience RPCs — server creates the correct entries
message SimpleIncomeRequest {
  string transaction_date = 1;
  string description = 2;
  string asset_account_id = 3;
  string income_account_id = 4;
  int64 amount_cents = 5;
  string note = 6;
  // Optional wall-clock time the transaction occurred (RFC3339). Empty = unset.
  string transaction_time = 7;
}

message SimpleExpenseRequest {
  string transaction_date = 1;
  string description = 2;
  string expense_account_id = 3;
  string asset_account_id = 4;
  int64 amount_cents = 5;
  string note = 6;
  // Optional wall-clock time the transaction occurred (RFC3339). Empty = unset.
  string transaction_time = 7;
}

message SimpleTransferRequest {
  string transaction_date = 1;
  string description = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount_cents = 5;
  string note = 6;
  // Optional wall-clock time the transaction occurred (RFC3339). Empty = unset.
  string transaction_time = 7;
}

message TransactionResponse {
  TransactionDTO transaction = 1;
}

// --- TransactionSummary ---

// Scope selects the aggregation period for TransactionSummary. UNSPECIFIED is
// treated as MONTH by the server for backward compatibility. DAY requires day
// to be set; YEAR ignores month/day.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_DAY = 1;
  SCOPE_MONTH = 2;
  SCOPE_YEAR = 3;
}

message TransactionSummaryRequest {
  // Calendar year, e.g. 2026.
  int32 year = 1;
  // Calendar month, 1-12. Ignored when scope = YEAR.
  int32 month = 2;
  // Optional: scope the summary to a single account (account_detail view).
  // Empty = all accounts.
  string account_id = 3;
  // Aggregation period. UNSPECIFIED defaults to MONTH for backward compat.
  Scope scope = 4;
  // Calendar day, 1-31. Required when scope = DAY; ignored otherwise.
  int32 day = 5;
}

message TransactionSummaryResponse {
  MonthlySummary summary = 1;
}

message MonthlySummary {
  int64 income_cents = 1;
  int64 expense_cents = 2;
  int64 net_cents = 3;
  int64 daily_avg_cents = 4;
  repeated DailyItem by_day = 5;
}

message DailyItem {
  // Calendar day in YYYY-MM-DD form (UTC midnight of the transaction's date).
  string date = 1;
  int64 total_income = 2;
  repeated CategoryItem by_category = 3;
}

message CategoryItem {
  string account_id = 1;
  string name = 2;
  // "income" or "expense".
  string account_type = 3;
  int64 amount = 4;
}
