syntax = "proto3";

package yucai.holding.v1;

option go_package = "github.com/yucai/server/internal/proto/holding/v1";

import "common/v1/pagination.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service HoldingService {
  rpc CreateSecurity(CreateSecurityRequest) returns (SecurityResponse);
  rpc ListSecurities(ListSecuritiesRequest) returns (ListSecuritiesResponse);
  rpc UpdateSecurityPrice(UpdatePriceRequest) returns (google.protobuf.Empty);
  rpc SearchSecurities(SearchSecuritiesRequest) returns (SearchSecuritiesResponse);
  rpc BuyHolding(HoldingTradeRequest) returns (HoldingTransactionResponse);
  rpc SellHolding(HoldingTradeRequest) returns (HoldingTransactionResponse);
  rpc RecordDividend(RecordDividendRequest) returns (HoldingTransactionResponse);
  rpc RecordSplit(RecordSplitRequest) returns (HoldingTransactionResponse);
  rpc ListHoldings(ListHoldingsRequest) returns (ListHoldingsResponse);
  rpc ListHoldingTransactions(ListTradesRequest) returns (ListTradesResponse);
  rpc SyncPrices(SyncPricesRequest) returns (SyncPricesResponse);
  rpc GetPortfolioPerformance(GetPortfolioPerformanceRequest) returns (PortfolioPerformanceResponse);
  rpc GetHoldingPerformance(GetHoldingPerformanceRequest) returns (HoldingPerformanceResponse);
  rpc BackfillPriceHistory(BackfillPriceHistoryRequest) returns (BackfillPriceHistoryResponse);
}

enum SecurityType {
  SECURITY_TYPE_UNSPECIFIED = 0;
  SECURITY_TYPE_STOCK = 1;
  SECURITY_TYPE_FUND = 2;
  SECURITY_TYPE_ETF = 3;
  SECURITY_TYPE_BOND = 4;
  SECURITY_TYPE_GOLD = 5;
  SECURITY_TYPE_OPTION = 6;
  SECURITY_TYPE_OTHER = 7;
}

enum TradeType {
  TRADE_TYPE_UNSPECIFIED = 0;
  TRADE_TYPE_BUY = 1;
  TRADE_TYPE_SELL = 2;
  TRADE_TYPE_DIVIDEND = 3;
  TRADE_TYPE_SPLIT = 4;
}

message SecurityDTO {
  string id = 1;
  string symbol = 2;
  string name = 3;
  SecurityType security_type = 4;
  string exchange = 5;
  string currency_code = 6;
  int64 current_price_cents = 7;
  google.protobuf.Timestamp created_at = 8;
}

message HoldingDTO {
  string id = 1;
  string account_id = 2;
  string security_id = 3;
  string security_name = 4;
  string security_symbol = 5;
  double quantity = 6;
  int64 avg_cost_cents = 7;
  int64 market_value_cents = 8;
  int64 unrealized_pnl_cents = 9;
  int64 version = 10;
}

message HoldingTransactionDTO {
  string id = 1;
  string account_id = 2;
  string security_id = 3;
  TradeType trade_type = 4;
  double quantity = 5;
  int64 price_cents = 6;
  int64 amount_cents = 7;
  int64 fee_cents = 8;
  string trade_date = 9;
  string notes = 10;
  google.protobuf.Timestamp created_at = 11;
}

message CreateSecurityRequest {
  string symbol = 1;
  string name = 2;
  SecurityType security_type = 3;
  string exchange = 4;
  string currency_code = 5;
}

message ListSecuritiesRequest {
  yucai.common.v1.PageRequest page = 1;
  SecurityType security_type = 2;
}

message UpdatePriceRequest {
  string security_id = 1;
  int64 price_cents = 2;
}

message SearchSecuritiesRequest {
  string query = 1;
  int32 limit = 2;
}

message HoldingTradeRequest {
  string account_id = 1;
  string security_id = 2;
  double quantity = 3;
  int64 price_cents = 4;
  int64 fee_cents = 5;
  string trade_date = 6;
  string notes = 7;
  // 双写资金来源账户(cash asset,savings/investment)。BuyHolding/SellHolding 必填;
  // buy:credit(现金−);sell:debit(现金+)。
  string from_account_id = 8;
}

message RecordDividendRequest {
  string account_id = 1;
  string security_id = 2;
  double quantity = 3;
  int64 cash_per_share_cents = 4;
  int64 total_amount_cents = 5;
  string trade_date = 6;
  string notes = 7;
}

message RecordSplitRequest {
  string account_id = 1;
  string security_id = 2;
  double ratio = 3;
  string split_date = 4;
  string notes = 5;
}

message ListHoldingsRequest {
  string account_id = 1;
  yucai.common.v1.PageRequest page = 2;
}

message ListTradesRequest {
  string account_id = 1;
  string security_id = 2;
  yucai.common.v1.PageRequest page = 3;
}

message SecurityResponse { SecurityDTO security = 1; }
message ListSecuritiesResponse { repeated SecurityDTO securities = 1; yucai.common.v1.PageResponse page = 2; }
message SearchSecuritiesResponse { repeated SecurityDTO securities = 1; }
message HoldingTransactionResponse { HoldingTransactionDTO transaction = 1; }
message ListHoldingsResponse { repeated HoldingDTO holdings = 1; yucai.common.v1.PageResponse page = 2; }
message ListTradesResponse { repeated HoldingTransactionDTO trades = 1; yucai.common.v1.PageResponse page = 2; }

message SyncPricesRequest {}

message SyncPricesResponse {
  int32 synced_count = 1;
  google.protobuf.Timestamp synced_at = 2;
}

enum CurveRange {
  CURVE_RANGE_UNSPECIFIED = 0;
  CURVE_RANGE_DAY = 1;
  CURVE_RANGE_MONTH = 2;
  CURVE_RANGE_YEAR = 3;
}

message CurvePoint {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}

message GetPortfolioPerformanceRequest {
  string account_id = 1;
  CurveRange range = 2;
  bool include_benchmark = 3;
  // Base currency to convert all amounts into (ISO 4217, e.g. "CNY").
  // Empty/unknown falls back to the tenant base currency (default CNY).
  string base_currency = 4;
}

message PortfolioPerformanceResponse {
  repeated CurvePoint portfolio_points = 1;
  repeated CurvePoint benchmark_points = 2;
  string benchmark_name = 3;
  int64 realized_cents = 4;
  int64 unrealized_cents = 5;
  int64 total_cents = 6;
  optional double annualized_pct = 7;        // 全期 XIRR 年化%(nil=降级)
  double total_pct = 8;
  string currency = 9;
  optional double range_annualized_pct = 10; // 区间 XIRR 年化%(随 CurveRange)
  optional double twr_annualized_pct = 11;   // TWR 时间加权年化%(全期,nil=降级)
  optional double range_twr_annualized_pct = 12; // TWR 区间年化%(随 CurveRange,nil=降级/区间不足)
  optional double cagr_annualized_pct = 13;        // CAGR: simple 复合年化 (final/initial)^(365/days)-1, 辅助指标, nil=降级
  optional double range_cagr_annualized_pct = 14;  // range CAGR (range start→now, nil=降级)
  // Primary return metric designation (audit 06 decision 1): XIRR (money-weighted,
  // all cash flows) is the primary headline metric; CAGR is auxiliary — its scope
  // is current-holdings cost basis → market value only and IGNORES realized PnL
  // (severely understates portfolios with liquidation+rebuild).
  optional ReturnMetric primary_return_metric = 15; // server 恒填 XIRR(主指标语义,client 展示层消费)
  optional CagrScope cagr_scope = 16;                // CAGR 口径标注(server 恒填 CURRENT_HOLDINGS_COST_TO_MV;client 渲染本地化 tooltip)
}

// ReturnMetric 组合收益头部主指标(语义归 server,展示归 client)。
enum ReturnMetric {
  RETURN_METRIC_UNSPECIFIED = 0;
  RETURN_METRIC_XIRR = 1; // money-weighted,全现金流(audit 06 决策 1 主指标)
}

// CagrScope CAGR(辅助指标)统计口径,机器可读。
enum CagrScope {
  CAGR_SCOPE_UNSPECIFIED = 0;
  // 仅当前持仓 costBasis→市值,忽略已实现盈亏。
  CAGR_SCOPE_CURRENT_HOLDINGS_COST_TO_MV = 1;
}

message GetHoldingPerformanceRequest {
  string holding_id = 1;
  CurveRange range = 2;
  // Base currency to convert all amounts into (ISO 4217, e.g. "CNY").
  // Empty/unknown falls back to the tenant base currency (default CNY).
  string base_currency = 3;
}

message HoldingPerformanceResponse {
  repeated CurvePoint price_points = 1;
  int64 realized_cents = 2;
  int64 unrealized_cents = 3;
  int64 total_cents = 4;
  string currency = 5;
  optional double annualized_pct = 6;       // 全期 XIRR(原币)
  optional double range_annualized_pct = 7; // 区间 XIRR(原币)
  optional double twr_annualized_pct = 8;   // TWR(原币,全期,nil=降级)
  optional double cagr_annualized_pct = 9;        // 单标的 price-based CAGR (first/range-start price→current)
  optional double range_cagr_annualized_pct = 10;
}

message BackfillPriceHistoryRequest {
  CurveRange range = 1;
}

message BackfillPriceHistoryResponse {
  int32 backfilled_count = 1;
}
