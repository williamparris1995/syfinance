syntax = "proto3";

package yucai.sync.v1;

option go_package = "github.com/yucai/server/internal/proto/sync/v1";

import "common/v1/pagination.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service SyncService {
  // Device registration + status
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc GetSyncStatus(GetSyncStatusRequest) returns (SyncStatusResponse);

  // Push/pull per entity batch
  rpc PushChanges(PushChangesRequest) returns (PushResponse);
  rpc PullChanges(PullChangesRequest) returns (PullChangesResponse);

  // Conflict resolution
  rpc ResolveConflict(ResolveConflictRequest) returns (google.protobuf.Empty);
  rpc ListConflicts(ListConflictsRequest) returns (ListConflictsResponse);
}

enum SyncOperation {
  SYNC_OPERATION_UNSPECIFIED = 0;
  SYNC_OPERATION_CREATE = 1;
  SYNC_OPERATION_UPDATE = 2;
  SYNC_OPERATION_DELETE = 3;
}

message SyncPayload {
  string entity_type = 1;
  SyncOperation operation = 2;
  bytes payload = 3;
  int64 version = 4;
  string device_id = 5;
  string entity_id = 6;
}

message RegisterDeviceRequest {
  string device_name = 1;
}

message RegisterDeviceResponse {
  string device_id = 1;
  int64 last_sync_version = 2;
}

// device_id is optional (proto3 empty string = default): empty requests the
// tenant-aggregate view (log frontier + pending conflicts, no device row);
// a non-empty device_id scopes the status to that registered device (F16).
message GetSyncStatusRequest {
  string device_id = 1;
}

message SyncStatusResponse {
  string device_id = 1;
  int64 last_sync_version = 2;
  google.protobuf.Timestamp last_sync_at = 3;
  int32 pending_conflicts = 4;
}

message PushChangesRequest {
  repeated SyncPayload changes = 1;
}

message PushResponse {
  int64 synced_version = 1;
  repeated ConflictDTO conflicts = 2;
}

message PullChangesRequest {
  int64 since_version = 1;
  repeated string entity_types = 2;
  int32 page_size = 3;
}

message PullChangesResponse {
  repeated SyncPayload changes = 1;
  int64 latest_version = 2;
  bool has_more = 3;
}

message ConflictDTO {
  string id = 1;
  string entity_type = 2;
  string entity_id = 3;
  bytes server_payload = 4;
  bytes client_payload = 5;
  string resolution = 6;
  // F16: conflict classification. Value domain today: "version_conflict"
  // (an UPDATE whose payload version was not ahead of the server row);
  // finer-grained classes arrive with F18. Non-breaking string field.
  string conflict_type = 7;
}

message ResolveConflictRequest {
  string conflict_id = 1;
  string resolution = 2;
  bytes merged_payload = 3;
}

message ListConflictsRequest {
  yucai.common.v1.PageRequest page = 1;
}

message ListConflictsResponse {
  repeated ConflictDTO conflicts = 1;
  yucai.common.v1.PageResponse page = 2;
}
