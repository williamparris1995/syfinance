# Development overrides — designed for remote Docker over SSH
services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile.dev
      # No bind mount — code is COPY'd into image via Dockerfile.dev
      # Rebuild with: docker compose -f docker-compose.yml -f docker-compose.dev.yml build api
    environment:
      - DATABASE_URL=postgresql://yucai:yucai_dev@postgres:5432/yucai?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-key-change-in-production
      - GRPC_PORT=9090
      - LOG_LEVEL=debug

  postgres:
    environment:
      POSTGRES_PASSWORD: yucai_dev
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    profiles:
      - dev
