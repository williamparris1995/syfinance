<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F22 · 设置 — 窗口与提醒 + 退出御财</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* ===== F22 新组件(仅 var(--*) 令牌) ===== */
  .set-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:18px 20px;margin-bottom:16px;
  }
  .set-card > h2{font-size:15px;font-weight:700;margin-bottom:14px}
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 0;
  }
  .setting-row + .setting-row{border-top:1px solid var(--line)}
  .setting-label{font-size:13px;font-weight:600}
  .setting-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* SegmentedButton(track/选中走令牌;与主题模式行同款) */
  .seg{display:inline-flex;background:var(--seg-track);border-radius:10px;padding:3px;gap:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
    padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .seg button.on{background:var(--surface);color:var(--acc);font-weight:600;box-shadow:var(--shadow)}
  /* 底部退出按钮:soft destructive(非实底,防误触;同 F21 警示强度) */
  .btn-exit-footer{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:40px;margin-top:8px;
    background:var(--neg-soft);border:1px solid var(--neg);border-radius:12px;
    color:var(--neg);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .btn-exit-footer:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">御</div>
      <div><div class="brand-name">御财</div><div class="brand-sub">YUCAI</div></div>
    </div>
    <div class="nav-group">
      <div class="g-label">工具</div>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</a>
    </div>
    <div class="user" style="margin-top:auto">
      <div class="avatar">御</div>
      <div><div class="user-name">本地用户</div><div class="user-mail">guest</div></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">工具 <span class="sep">››</span> <b>设置</b></div>
      <div class="topbar-right">
        <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="page" style="max-width:760px">
      <div class="page-head"><h1>设置</h1></div>

      <!-- 既有区:外观(上下文,非 F22 交付) -->
      <section class="set-card">
        <h2>外观</h2>
        <div class="setting-row">
          <div><div class="setting-label">主题模式</div></div>
          <div class="seg" role="group" aria-label="主题模式">
            <button>跟随系统</button><button>亮色</button><button class="on">暗色</button>
          </div>
        </div>
      </section>

      <!-- 既有区:数据(上下文,节选;F21 已交付) -->
      <section class="set-card">
        <h2>数据</h2>
        <div class="setting-row">
          <div><div class="setting-label">导入存档</div><div class="setting-hint">从存档文件恢复(覆盖本地数据)</div></div>
        </div>
      </section>

      <!-- ===== F22 新增:窗口与提醒 ===== -->
      <section class="set-card" id="windowReminders">
        <h2>窗口与提醒</h2>
        <div class="setting-row">
          <div>
            <div class="setting-label">关闭按钮行为</div>
            <div class="setting-hint">点窗口 ✕ 时:隐藏到托盘继续运行,或直接退出</div>
          </div>
          <div class="seg" role="group" aria-label="关闭按钮行为">
            <button class="on">隐藏到托盘</button><button>退出程序</button>
          </div>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-label">提醒检查频率</div>
            <div class="setting-hint">到期提醒与自动记账的定时扫描间隔;数据变更时总会即时检查</div>
          </div>
          <div class="seg" role="group" aria-label="提醒检查频率">
            <button>15 分钟</button><button class="on">30 分钟</button><button>60 分钟</button>
          </div>
        </div>
      </section>

      <!-- ===== F22 新增:退出(页面最底,全宽 soft destructive) ===== -->
      <button class="btn-exit-footer" id="exitApp" aria-label="退出御财">
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出御财
      </button>
    </div>
  </main>

<script>
  // 主题切换(演示;存储 key 对齐 design-output 惯例)
  const root=document.documentElement;
  const saved=localStorage.getItem('yc2-theme'); if(saved) root.dataset.theme=saved;
  document.getElementById('themeToggle').onclick=()=>{
    root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
    localStorage.setItem('yc2-theme',root.dataset.theme);
  };
  // 演示交互:分段选中
  document.querySelectorAll('.seg').forEach(seg=>{
    seg.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    });
  });
</script>
</body>
</html>
