<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F22 · 首次关闭对话框</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root{ --scrim:rgba(2,6,16,.55); } /* 页级令牌定义(遮罩) */
  body{display:block !important;place-items:center}
  .stage{
    min-height:100vh;display:grid;place-items:center;
    background:var(--bg);padding:32px;
  }
  .stage::before{ /* 模拟被遮住的主窗口内容 */
    content:"";position:fixed;inset:0;
    background:var(--surface-2);
  }
  .backdrop{
    position:fixed;inset:0;background:var(--scrim);
    display:grid;place-items:center;z-index:10;
  }
  .dialog{
    position:relative;width:min(400px,92vw);
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:20px 20px 16px;box-shadow:var(--shadow);
  }
  .dialog h2{font-size:15px;font-weight:700;margin-bottom:8px}
  .dialog p{font-size:13px;color:var(--muted);line-height:1.6}
  .dialog .x{
    position:absolute;top:12px;right:12px;width:26px;height:26px;
    display:grid;place-items:center;border:0;border-radius:8px;
    background:transparent;color:var(--muted);cursor:pointer;
  }
  .dialog .x:hover{color:var(--fg);background:var(--seg-track)}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .btn-secondary{ /* 次按钮:文字态 destructive */
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
    padding:8px 12px;border-radius:10px;cursor:pointer;
  }
  .btn-secondary:hover{color:var(--neg);background:var(--neg-soft)}
  .btn-primary{height:34px;padding:0 16px;font-size:13px;border:0;cursor:pointer;
    background:var(--btn-bg);color:var(--btn-fg);border-radius:10px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px}
  .btn-primary:hover{filter:brightness(1.05)}
  .kbd-hint{margin-top:12px;font-size:11px;color:var(--muted);text-align:right}
  .toggle{
    position:fixed;top:16px;right:16px;z-index:20;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="backdrop">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <button class="x" id="dlgClose" aria-label="取消关闭" title="取消关闭(Esc)">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <h2 id="dlgTitle">御财将最小化到系统托盘</h2>
        <p>关闭窗口后,御财仍会在系统托盘继续运行(到期提醒与自动记账不受影响)。可随时点击托盘图标恢复窗口。</p>
        <div class="actions">
          <button class="btn-secondary" id="quit">退出程序</button>
          <button class="btn-primary" id="minimize" autofocus>
            <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            最小化到托盘
          </button>
        </div>
        <div class="kbd-hint">Esc 或 × = 取消本次关闭 · 此提示仅出现一次</div>
      </div>
    </div>
  </div>
  <button class="icon-btn toggle" id="themeToggle" title="切换主题" aria-label="切换主题">
    <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
<script>
  const root=document.documentElement;
  const saved=localStorage.getItem('yc2-theme'); if(saved) root.dataset.theme=saved;
  document.getElementById('themeToggle').onclick=()=>{
    root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
    localStorage.setItem('yc2-theme',root.dataset.theme);
  };
  const close=()=>document.getElementById('dlgClose').textContent='已取消:窗口保留,下次关闭仍会提示';
  document.getElementById('dlgClose').onclick=close;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
</script>
</body>
</html>
