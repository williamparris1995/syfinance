<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=820">
<title>御财 · 目标详情 — Tablet</title>

<!-- ======================================================================
     GoalDetailPage · Tablet (820 · AppBar + 上下堆叠)
     spec §5.3 (3) · 同 desktop,布局单列堆叠,hero 进度环居中
     API 同 goal-detail-desktop.html(GetGoal ✅ / RecordContribution ⏳ / CloneGoal ✅)
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg); }
  .detail-hero { flex-direction: column; text-align: center; gap: 18px; padding: 22px; }
  .dh-name { justify-content: center; }
  .dh-vals { justify-content: center; }
  .dh-remain { justify-content: center; }
</style>
</head>
<body>

<header class="app-bar">
  <span style="cursor:pointer;color:var(--muted)" onclick="location.href='goal-list-tablet.html'"><span id="backIcon"></span></span>
  <div class="ab-title" id="pageTitle">目标详情</div>
  <button class="icon-btn" title="编辑" onclick="location.href='goal-edit-tablet.html?id=' + (new URLSearchParams(location.search).get('id')||'g1')"><span id="editIcon"></span></button>
  <button class="icon-btn" title="复制" id="dupBtn"><span id="dupIcon"></span></button>
</header>

<div class="page-pad">
  <section class="detail-hero" id="detailHero"></section>
  <section id="linkedCard"></section>
  <div class="card" id="contribCard"></div>
  <div id="trendCard"></div>
  <div class="card" style="padding:14px 16px">
    <div class="action-row" id="actionRow" style="justify-content:center"></div>
  </div>
</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;
  var fmtCNY = window.fmtCNY;
  document.getElementById('backIcon').innerHTML = icon('arrow-left');
  document.getElementById('editIcon').innerHTML = icon('pencil');
  document.getElementById('dupIcon').innerHTML = icon('copy');

  var qs = new URLSearchParams(location.search);
  var GOAL_ID = qs.get('id') || 'g1';
  var g = window.GOALS.find(function (x) { return x.id === GOAL_ID; }) || window.GOALS[0];
  var v = window.goalView(g.id);
  var meta = v.typeMeta;
  document.getElementById('pageTitle').textContent = g.name;

  var ringColor = v.status === 'completed' ? 'var(--up)' : (v.status === 'behind' ? 'var(--down)' : meta.color);
  var ringStyle = window.ringGradient(v.pct, ringColor);
  var remainCents = Math.max(0, g.target_cents - g.current_cents);
  document.getElementById('detailHero').className = 'detail-hero ' + v.status;
  document.getElementById('detailHero').innerHTML =
      '<div class="progress-ring ring-lg" style="background:' + ringStyle + '"><div class="pr-hole"><span class="pr-pct">' + v.pct.toFixed(1) + '%</span><span class="pr-label">已达成</span></div></div>'
    + '<div class="dh-info">'
    +   '<div class="dh-name">' + icon(meta.icon) + '<span class="type-chip ' + meta.chipCls + '"><span class="tc-dot"></span>' + meta.label + '</span>'
    +     '<span class="status-pill ' + v.status + '">' + icon(v.status === 'completed' ? 'check-circle' : v.status === 'behind' ? 'alert-triangle' : 'trending-up') + (v.completed ? '已完成' : v.status === 'behind' ? '落后' : '进行中') + '</span></div>'
    +   '<div class="dh-vals"><span class="dh-current">' + fmtCNY(g.current_cents) + '<span class="cc">CNY</span></span><span class="dh-sep">/</span><span class="dh-target">' + fmtCNY(g.target_cents) + '</span></div>'
    +   '<div class="dh-remain"><span class="pill-num">还差 ' + fmtCNY(remainCents) + '</span><span>' + icon('calendar') + '剩 ' + v.daysLeft + ' 天 · ' + g.deadline + '</span></div>'
    + '</div>';

  var linkedHtml = '';
  if (v.linkedType === 'account') { var a = v.linked;
    linkedHtml = '<div class="linked-card"><div class="lc-icon account">' + icon('wallet') + '</div><div class="lc-info"><span class="lc-label">关联账户</span><span class="lc-name">' + a.name + '</span><span class="lc-meta">' + a.type + '</span></div><div class="lc-val">' + fmtCNY(a.balance_cents) + '<span class="cc">CNY</span></div></div>';
  } else if (v.linkedType === 'debt') { var d = v.linked;
    linkedHtml = '<div class="linked-card"><div class="lc-icon debt">' + icon('credit-card') + '</div><div class="lc-info"><span class="lc-label">关联债务</span><span class="lc-name">' + d.name + '</span><span class="lc-meta">APR ' + d.apr + '%</span></div><div class="lc-val">剩 ' + fmtCNY(d.remaining_principal_cents) + '<span class="cc">CNY</span></div></div>';
  } else if (v.linkedType === 'holding') { var h = v.linked;
    linkedHtml = '<div class="linked-card"><div class="lc-icon holding">' + icon('trending-up') + '</div><div class="lc-info"><span class="lc-label">关联持仓</span><span class="lc-name mono">' + h.symbol + '</span><span class="lc-meta">' + h.name + '</span></div><div class="lc-val">' + fmtCNY(h.market_value_cents) + '<span class="cc">CNY</span></div></div>';
  }
  document.getElementById('linkedCard').innerHTML = linkedHtml;

  var contribs = window.CONTRIBUTIONS[g.id] || [];
  var cb = '<div class="card-head"><div class="card-title"><span>' + icon('coins') + '</span>手动记贡献</div><span class="card-sub">⏳ Phase 1 · ' + contribs.length + ' 条</span></div>';
  cb += '<div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border)"><input class="form-control" type="date" style="width:auto;flex:0 0 130px" value="2026-06-30"><div class="input-prefix" style="flex:1;min-width:100px"><span class="ip-pre">¥</span><input class="form-control mono" type="number" placeholder="2000"></div><button class="btn btn-gold btn-sm">' + icon('plus', 'icon-sm') + '记</button></div>';
  cb += contribs.length === 0 ? '<div class="empty" style="padding:24px"><div class="empty-text">暂无贡献</div></div>'
    : '<table class="contrib-table"><thead><tr><th>日期</th><th>金额</th><th>备注</th></tr></thead><tbody>' + contribs.map(function (c) { return '<tr><td>' + c.date + '</td><td class="num amt-pos">+' + fmtCNY(c.amount_cents) + '</td><td>' + (c.note || '—') + '</td></tr>'; }).join('') + '</tbody></table>';
  document.getElementById('contribCard').innerHTML = cb;

  document.getElementById('trendCard').innerHTML = '<div class="card"><div class="card-head"><div class="card-title"><span>' + icon('trending-up') + '</span>趋势曲线</div><span class="card-sub">⏳ Phase 2</span></div></div>'
    + '<div class="trend-placeholder" style="margin-top:8px"><div class="tp-icon">' + icon('trending-up') + '</div><div class="tp-title">即将上线</div><div class="tp-text">照 holding perf curve</div><div class="tp-badge">Phase 2</div></div>';

  var actHtml = '';
  if (!v.completed) actHtml += '<button class="btn btn-gold" style="flex:1;justify-content:center">' + icon('check-circle', 'icon-sm') + '标记完成</button>';
  actHtml += '<button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="location.href=\'goal-edit-tablet.html?id=' + g.id + '\'">' + icon('pencil', 'icon-sm') + '编辑</button>';
  actHtml += '<button class="btn btn-danger" style="flex:1;justify-content:center">' + icon('trash-2', 'icon-sm') + '删除</button>';
  document.getElementById('actionRow').innerHTML = actHtml;

  function flash(msg) { var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = icon('check-circle') + msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }
  document.getElementById('dupBtn').onclick = function () { flash('已复制「' + g.name + '」(mock · CloneGoal)'); };
})();
</script>
</body>
</html>
