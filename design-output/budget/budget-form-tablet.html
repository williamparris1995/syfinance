<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=820">
<title>御财 · 新建预算 — Tablet</title>

<!-- ======================================================================
     BudgetFormPage · Tablet (820 · 单栏 AppBar + 表单)
     ----------------------------------------------------------------------------
     spec §5 (2): 无 type + month picker + CurrencyCode + Items 编辑(expense 账户)
     API 标注: CreateBudget(name, month, currency_code, items[BudgetItemInput])
     数据源: window.EXPENSE_ACCOUNTS / window.BUDGET_TEMPLATES (mock-data.js)
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-bar">
  <button class="icon-btn" onclick="location.href='budget-list-tablet.html'"><span id="backIcon"></span></button>
  <div class="ab-title">新建预算</div>
  <button class="icon-btn" id="saveTopBtn" title="保存" style="color:var(--gold-deep)"><span id="saveIcon"></span></button>
</div>

<div class="page-pad">
  <div class="api-note">
    <span class="an-badge">API</span>
    <span id="apiNoteIcon"></span>
    <div><strong>CreateBudget(name, month, currency_code, items[])</strong> — items ≥1,仅 expense 账户。保存后自动 ComputeBudgetActuals。</div>
  </div>

  <div class="form-card">
    <div class="form-section-title"><span id="secInfo"></span>基本信息</div>
    <div class="form-group">
      <label class="form-label">预算名称 <span class="req">*</span></label>
      <input class="form-control" type="text" value="日常开销预算">
    </div>
    <div class="form-group">
      <label class="form-label">月份 <span class="req">*</span></label>
      <div class="month-input"><span id="mpCal"></span>2026-07<span class="acc-caret" style="margin-left:auto"><span id="mpCaret"></span></span></div>
      <div class="form-hint">yyyy-MM,保存后不可改</div>
    </div>
    <div class="form-group">
      <label class="form-label">货币</label>
      <input class="form-control" type="text" value="CNY (人民币)" disabled>
    </div>

    <div class="form-section-title" style="margin-top:8px"><span id="secTpl"></span>从模板开始(可选)</div>
    <div class="template-chips" id="tplChips"></div>

    <div class="form-section-title" style="margin-top:18px"><span id="secItems"></span>预算条目<span style="color:var(--down);font-size:12px;margin-left:6px">至少 1 项</span></div>
    <div id="itemRows"></div>
    <div style="margin-top:10px"><button class="item-add-btn" id="addItemBtn"><span id="addIco"></span>添加条目</button></div>

    <div class="action-row" style="margin-top:24px">
      <button class="btn btn-ghost" style="flex:1" onclick="location.href='budget-list-tablet.html'">取消</button>
      <button class="btn btn-gold" style="flex:1" id="saveBtn"><span id="saveIcon2"></span>保存预算</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none"><span id="toastIco"></span><span id="toastMsg"></span></div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;
  document.getElementById('backIcon').innerHTML = icon('arrow-left');
  document.getElementById('saveIcon').innerHTML = icon('check');
  document.getElementById('saveIcon2').innerHTML = icon('check','icon-sm');
  document.getElementById('apiNoteIcon').innerHTML = icon('info');
  document.getElementById('secInfo').innerHTML = icon('info');
  document.getElementById('mpCal').innerHTML = icon('calendar');
  document.getElementById('mpCaret').innerHTML = icon('chevron-down');
  document.getElementById('secTpl').innerHTML = icon('copy');
  document.getElementById('secItems').innerHTML = icon('pie-chart');
  document.getElementById('addIco').innerHTML = icon('plus','icon-sm');
  document.getElementById('toastIco').innerHTML = icon('check-circle');

  document.getElementById('tplChips').innerHTML = window.BUDGET_TEMPLATES.map(function (t) {
    return '<span class="tpl-chip">' + icon(t.icon) + t.name + '</span>';
  }).join('');

  var defaultAccs = ['ea1','ea2','ea3','ea4'];
  var rows = defaultAccs.map(function (aid,i) {
    var acc = window.accountById(aid); return { acc: acc, planned: [380000,120000,150000,150000][i] };
  });
  function renderRows() {
    document.getElementById('itemRows').innerHTML = rows.map(function (r, idx) {
      var acc = r.acc;
      return '<div class="item-row" data-idx="' + idx + '">'
        + '<div class="ir-acc"><div class="acc-select">'
        +   '<span class="acc-ico">' + icon(acc?acc.icon:'wallet') + '</span>'
        +   '<span>' + (acc?acc.name:'选择分类') + '</span>'
        +   '<span class="acc-caret">' + icon('chevron-down') + '</span></div></div>'
        + '<div class="ir-amt"><div class="input-prefix"><span class="ip-pre">¥</span>'
        +   '<input class="form-control mono" type="text" value="' + (r.planned/100).toFixed(2) + '"></div></div>'
        + '<button class="icon-btn ir-rm" data-rm="' + idx + '">' + icon('trash-2','icon-sm') + '</button></div>';
    }).join('');
    document.querySelectorAll('[data-rm]').forEach(function (b) {
      b.addEventListener('click', function(){ rows.splice(parseInt(b.dataset.rm,10),1); renderRows(); });
    });
  }
  renderRows();
  document.getElementById('addItemBtn').addEventListener('click', function () {
    var used = rows.map(function(r){return r.acc?r.acc.id:null;});
    var next = window.EXPENSE_ACCOUNTS.find(function(a){return used.indexOf(a.id)===-1;});
    rows.push({ acc: next||null, planned: 0 }); renderRows();
  });
  function toast(m){ document.getElementById('toastMsg').textContent=m; document.getElementById('toast').style.display='inline-flex';
    setTimeout(function(){document.getElementById('toast').style.display='none';},1800); }
  document.getElementById('saveBtn').addEventListener('click', function(){ if(rows.length<1){toast('至少 1 个条目');return;} toast('已保存(CreateBudget)'); });
  document.getElementById('saveTopBtn').addEventListener('click', function(){ if(rows.length<1){toast('至少 1 个条目');return;} toast('已保存'); });
})();
</script>
</body>
</html>
