<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Security 管理 · Tablet · 御财持仓</title>
<!--
  ============================================================================
  Security 管理 · Tablet（768–1023px · 834×1194 · 紧凑表格 + bottom sheet）
  ----------------------------------------------------------------------------
  API 标注（对照 spec §3）:
    - CreateSecurity(symbol, name, type, exchange, currency)        ✅ 已实现
    - ListSecurities()                                              ✅ 已实现
    - SearchSecurities(query)                                       ✅ 已实现
    - UpdateSecurityPrice(security_id, price)  手动行内改价          ✅ 已实现
    - 自动 sync provider(scheduler + 行情 API)                       ⏳ B 子项目（开关 disabled）
  Mock 演示（mock-data.js）：6 securities；price/updated 覆盖在本地 <script>
  ============================================================================
-->
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg-deep); padding: 0; }
  .demo-shell { width: 834px; margin: 24px auto; }
  .sec-table th, .sec-table td { padding-left: 16px; padding-right: 16px; }
  .sec-table th:first-child, .sec-table td:first-child { padding-left: 22px; }
  .sec-table th:last-child, .sec-table td:last-child { padding-right: 22px; }
  .sec-table th.ops, .sec-table td.ops { width: 60px; text-align: right; }
</style>
</head>
<body>
<div class="demo-shell">
  <div class="tablet-shell" style="position:relative;">
    <!-- ============ 顶栏 ============ -->
    <div class="tb-top">
      <div>
        <h1>Security 管理</h1>
        <div class="tb-sub">证券字典 · 价格管理 · 共 6 个</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button id="refreshBtn" class="btn btn-refresh">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
          刷新
        </button>
        <button id="createBtn" class="btn btn-gold">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          新建
        </button>
      </div>
    </div>

    <div class="tb-body">
      <!-- 搜索 -->
      <div class="search" style="width:100%;padding:11px 14px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="搜索 symbol / 名称…" style="border:none;outline:none;background:transparent;font-size:14px;width:100%;">
      </div>

      <!-- sync 提示条 -->
      <div class="card" style="padding:11px 16px;display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-color:var(--gold-soft);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-deep);width:17px;height:17px;flex-shrink:0;"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <div style="flex:1;font-size:12.5px;color:var(--gold-deep);min-width:0;">
          <strong>自动同步未启用</strong> · <span style="color:var(--muted);">B 子项目：scheduler + 行情 API</span>
        </div>
        <div class="provider-select" id="globalProvider">
          <div class="ps-current">
            <span class="ps-dot" style="width:7px;height:7px;border-radius:50%;background:#5f01d1;display:inline-block;"></span>
            <strong id="globalProvName" style="color:var(--fg-strong);">Yahoo</strong>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- 表格 -->
      <div class="card table-card tb-table">
        <div class="card-head">
          <div class="card-title">证券列表</div>
          <div class="card-sub" id="rowCount">共 6 个</div>
        </div>
        <table class="holdings-table sec-table">
          <thead>
            <tr>
              <th>Symbol / 名称</th>
              <th style="width:70px;">Type</th>
              <th style="width:80px;">币种</th>
              <th class="num" style="width:130px;">现价</th>
              <th class="sync" style="width:130px;">自动同步</th>
              <th class="num" style="width:96px;">更新</th>
              <th class="ops"></th>
            </tr>
          </thead>
          <tbody id="secBody"></tbody>
        </table>
        <div id="searchEmpty" class="search-empty" style="display:none;">
          <div class="se-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
          <div class="se-title">未找到匹配的 Security</div>
          <div class="se-text">试试其他 symbol 或名称关键词</div>
        </div>
      </div>
    </div>

    <!-- ============ 创建 bottom sheet ============ -->
    <div id="sheetOverlay" class="sheet-overlay" style="display:none;"></div>
    <div id="sheet" class="sheet size-tablet" style="display:none;">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <div class="sh-title">
          <h2>新建 Security</h2>
          <div class="sh-sub">CreateSecurity · ✅ 已实现</div>
        </div>
        <button class="icon-btn" id="sheetClose"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <form class="sheet-body" id="createForm" onsubmit="return false;">
        <div class="form-grid" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Symbol <span class="req">*</span></label><input class="input mono" name="symbol" placeholder="AAPL" required></div>
          <div class="field"><label class="field-label">Currency <span class="req">*</span></label>
            <select class="select mono" name="currency"><option>CNY</option><option>USD</option><option>HKD</option></select>
          </div>
          <div class="field span-2"><label class="field-label">名称 <span class="req">*</span></label><input class="input" name="name" placeholder="Apple Inc." required></div>
          <div class="field"><label class="field-label">Type <span class="req">*</span></label>
            <select class="select" name="type"><option value="stock">股票</option><option value="fund">基金</option><option value="etf">ETF</option><option value="bond">债券</option><option value="gold">黄金</option></select>
          </div>
          <div class="field"><label class="field-label">Exchange <span class="req">*</span></label><input class="input mono" name="exchange" placeholder="NASDAQ / SH" required></div>
        </div>
      </form>
      <div class="sheet-foot">
        <span class="api-badge done"><span class="dot"></span>CreateSecurity ✅</span>
        <button class="btn btn-ghost" id="sheetCancel">取消</button>
        <button class="btn btn-gold" id="sheetSave">创建</button>
      </div>
    </div>

    <div class="toast-host" id="toastHost"></div>
  </div>
</div>

<script src="mock-data.js"></script>
<script>
window.PRICE_OVERRIDE = {
  s1: { price: 185.00, updated: '2026-06-29 09:30:00' },
  s2: { price: 10.85,  updated: '2026-06-29 15:00:00' },
  s3: { price: 4.12,   updated: '2026-06-29 15:00:00' },
  s4: { price: 2.68,   updated: '2026-06-28 15:00:00' },
  s5: { price: 101.20, updated: '2026-06-27 15:00:00' },
  s6: { price: 545.00, updated: '2026-06-29 15:00:00' },
};
window.SECURITIES && Object.keys(window.SECURITIES).forEach(function (sid) {
  if (!window.PRICE_OVERRIDE[sid]) {
    var h = (window.HOLDINGS || []).find(function (x) { return x.security_id === sid; });
    if (h) window.PRICE_OVERRIDE[sid] = { price: h.current_price, updated: '2026-06-28 15:00:00' };
  }
});
var PROVIDERS = [
  { id: 'yahoo',  name: 'Yahoo',  color: '#5f01d1' },
  { id: 'sina',   name: '新浪',   color: '#cf1322' },
  { id: 'tencent', name: '腾讯',  color: '#1a9c2c' },
];
var globalProvider = PROVIDERS[0];

function relTime(absStr) {
  var t = new Date(absStr.replace(' ', 'T'));
  var now = new Date('2026-06-29 15:05:00');
  var diff = Math.max(0, (now - t) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + '分前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  return Math.floor(diff / 86400) + '天前';
}

function renderList(q) {
  var body = document.getElementById('secBody');
  var sids = Object.keys(window.SECURITIES);
  if (q) {
    var ql = q.toLowerCase();
    sids = sids.filter(function (sid) {
      var s = window.SECURITIES[sid];
      return s.symbol.toLowerCase().indexOf(ql) >= 0 || (s.name || '').toLowerCase().indexOf(ql) >= 0;
    });
  }
  document.getElementById('rowCount').textContent = '共 ' + sids.length + ' 个';
  document.getElementById('searchEmpty').style.display = sids.length === 0 ? 'block' : 'none';
  body.innerHTML = sids.map(function (sid) {
    var s = window.SECURITIES[sid];
    var po = window.PRICE_OVERRIDE[sid] || {};
    var meta = window.TYPE_META[s.type] || { label: s.type, color: 'var(--gold)' };
    return '<tr data-sid="' + sid + '">'
      + '<td><div class="cell-sym"><span class="sym">' + s.symbol + '</span><span class="name">' + s.name + '</span></div></td>'
      + '<td><span class="type-tag" style="background:var(--accent-soft);color:' + meta.color + ';">' + meta.label + '</span></td>'
      + '<td><span class="mono" style="font-size:12px;">' + s.currency + '</span></td>'
      + '<td class="num"><div class="price-cell" data-sid="' + sid + '">'
      +   '<span class="pc-val">' + window.fmtRaw(po.price, s.currency) + '</span>'
      +   '<span class="pc-edit" data-sid="' + sid + '" title="编辑现价"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>'
      + '</div></td>'
      + '<td class="sync"><div class="sync-cell disabled" title="B 子项目：scheduler + 行情 API（待实现）">'
      +   '<div class="sync-toggle"><svg class="icon st-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>'
      +   '<div class="sync-meta"><span class="sm-provider">未启用</span><span class="sm-hint">B 子项目</span></div>'
      + '</div></td>'
      + '<td class="num"><div class="updated-cell"><span class="upd-rel">' + relTime(po.updated) + '</span></div></td>'
      + '<td class="ops"><div class="sec-actions"><button class="icon-btn pc-edit" data-sid="' + sid + '" title="编辑现价"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div></td>'
      + '</tr>';
  }).join('');
  bindRowEvents();
}

function bindRowEvents() {
  document.querySelectorAll('.pc-edit').forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); enterEdit(el.getAttribute('data-sid')); };
  });
}

function enterEdit(sid) {
  var cell = document.querySelector('.price-cell[data-sid="' + sid + '"]');
  if (!cell || cell.classList.contains('editing')) return;
  var po = window.PRICE_OVERRIDE[sid] || {};
  cell.classList.add('editing');
  cell.innerHTML = '<input class="input pc-input mono" value="' + po.price + '" data-sid="' + sid + '">'
    + '<button class="pc-go" data-sid="' + sid + '"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>'
    + '<button class="pc-no" data-sid="' + sid + '"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>';
  var inp = cell.querySelector('.pc-input'); inp.focus(); inp.select();
  cell.querySelector('.pc-go').onclick = function () { savePrice(sid, inp.value); };
  cell.querySelector('.pc-no').onclick = function () { renderList(currentQuery()); };
  inp.onkeydown = function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); savePrice(sid, inp.value); }
    if (ev.key === 'Escape') { renderList(currentQuery()); }
  };
}

function savePrice(sid, raw) {
  var v = parseFloat(raw);
  if (!isFinite(v) || v <= 0) { toast('现价无效，需为正数', 'warn'); return; }
  var old = (window.PRICE_OVERRIDE[sid] || {}).price;
  window.PRICE_OVERRIDE[sid] = { price: v, updated: '2026-06-29 15:05:00' };
  renderList(currentQuery());
  toast('✓ ' + window.SECURITIES[sid].symbol + ' 现价：' + window.fmtRaw(old, window.SECURITIES[sid].currency) + ' → ' + window.fmtRaw(v, window.SECURITIES[sid].currency), 'ok');
}

document.getElementById('globalProvider').onclick = function (e) {
  closeGlobalMenu();
  var menu = document.createElement('div');
  menu.className = 'ps-menu'; menu.id = 'openGlobalMenu'; menu.style.right = '0';
  menu.innerHTML = PROVIDERS.map(function (p) {
    return '<div class="ps-item' + (p.id === globalProvider.id ? ' active' : '') + '" data-prov="' + p.id + '"><span class="ps-dot" style="background:' + p.color + ';"></span>' + p.name + '</div>';
  }).join('');
  e.currentTarget.appendChild(menu);
  menu.querySelectorAll('.ps-item').forEach(function (it) {
    it.onclick = function (ev) {
      ev.stopPropagation();
      globalProvider = PROVIDERS.find(function (x) { return x.id === it.getAttribute('data-prov'); });
      document.getElementById('globalProvName').textContent = globalProvider.name;
      closeGlobalMenu();
      toast('全局行情源：' + globalProvider.name + '（mock · 不发请求）', 'ok');
    };
  });
  setTimeout(function () { document.addEventListener('click', closeGlobalMenu, { once: true }); }, 0);
};
function closeGlobalMenu() { var m = document.getElementById('openGlobalMenu'); if (m) m.remove(); }

function currentQuery() { return document.getElementById('searchInput').value.trim(); }
document.getElementById('searchInput').oninput = function () { renderList(currentQuery()); };

document.getElementById('refreshBtn').onclick = function () {
  var btn = this;
  if (btn.classList.contains('spinning')) return;
  btn.classList.add('spinning'); btn.disabled = true;
  setTimeout(function () {
    Object.keys(window.PRICE_OVERRIDE).forEach(function (sid) {
      var po = window.PRICE_OVERRIDE[sid];
      var delta = po.price * (Math.random() - 0.5) * 0.01;
      window.PRICE_OVERRIDE[sid] = { price: +(po.price + delta).toFixed(4), updated: '2026-06-29 15:05:00' };
    });
    renderList(currentQuery());
    btn.classList.remove('spinning'); btn.disabled = false;
    toast('✓ 已刷新全部价格（mock 模拟波动）', 'ok');
  }, 1200);
};

var sheet = document.getElementById('sheet');
var sheetOverlay = document.getElementById('sheetOverlay');
function openSheet() { sheet.style.display = 'flex'; sheetOverlay.style.display = 'flex'; }
function closeSheet() { sheet.style.display = 'none'; sheetOverlay.style.display = 'none'; document.getElementById('createForm').reset(); }
document.getElementById('createBtn').onclick = openSheet;
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetCancel').onclick = closeSheet;
document.getElementById('sheetSave').onclick = function () {
  var f = document.getElementById('createForm');
  if (!f.reportValidity()) return;
  var data = new FormData(f);
  toast('✓ 已创建：' + data.get('symbol') + ' · ' + data.get('name') + '（mock 不真存）', 'ok');
  closeSheet();
};

function toast(msg, kind) {
  var host = document.getElementById('toastHost');
  var t = document.createElement('div');
  t.className = 'toast ' + (kind === 'ok' ? 'ok' : '');
  t.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (kind === 'ok' ? '<path d="M20 6 9 17l-5-5"/>' : '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>') + '</svg>' + msg;
  host.appendChild(t);
  setTimeout(function () { t.remove(); }, 2100);
}

renderList('');
</script>
</body>
</html>
