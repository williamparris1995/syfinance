<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1480">
<title>御财 · 持仓列表 — Desktop</title>

<!-- ======================================================================
     API 标注
     · API: ListHoldings(tenant_id, type_filter?)                    ✅ A-server 已实现
     · API: 聚合统计 / 资产配置占比 / 多币种汇总                         ⏳ 首批前端从 ListHoldings
           计算（server summary 端点后置）
     · 数据源：window.HOLDINGS / window.SECURITIES / window.ACCOUNTS（mock-data.js）
     · 汇率：USD → CNY = 7.25（USD 持仓按此折算后计入占比/汇总）
     · P&L 用平均成本 mock（holdingView：pnl = mktVal − cost，非 FIFO），
       A-flutter 接 ⏳C snapshot 替换（FIFO/移动加权由 server 计算）
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
<style>
  /* desktop 专属微调 */
  .desk-main { min-height: 900px; }
</style>
</head>
<body class="d-desktop">

<div class="desk-shell">

  <!-- ============ 左侧固定侧栏（type 导航）============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">御</div>
      <div class="brand-name">御财<span> · 持仓</span></div>
    </div>

    <div class="nav-sec">
      <div class="nav-sec-label">资产类型</div>
      <div id="navList"></div>
    </div>

    <div class="nav-sec">
      <div class="nav-sec-label">账户</div>
      <div class="nav-item"><span id="iconWallet"></span>美股账户<span class="nav-cnt">USD</span></div>
      <div class="nav-item"><span id="iconLand"></span>A股账户<span class="nav-cnt">CNY</span></div>
    </div>

    <div class="sidebar-foot">
      数据更新于 2026-06-29 15:00<br>仅供参考，不构成投资建议
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="desk-main">

    <!-- 顶栏 -->
    <header class="topbar-d">
      <div class="tb-left">
        <h1>持仓列表</h1>
        <div class="tb-sub">共 <span id="countAll" class="mono">0</span> 只证券 · 跨 <span class="mono">2</span> 个账户</div>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <span id="iconSearch"></span>
          <input type="text" placeholder="搜索代码 / 名称">
        </div>
        <button class="icon-btn" title="刷新" id="iconRefreshBtn"></button>
        <button class="btn btn-gold" id="addBtn">
          <span class="icon icon-sm" data-icon="plus"></span>添加持仓
        </button>
      </div>
    </header>

    <!-- API: 概览统计（前端从 ListHoldings 聚合） -->
    <!-- StatCard 概览 4 格 -->
    <section class="stat-grid cols-4 desk-stats" id="stats"></section>

    <!-- 饼图 + 持仓表 -->
    <section class="desk-grid">

      <!-- 资产配置饼图 -->
      <!-- API: 资产配置占比（前端从 ListHoldings × current_price 聚合，USD 按 7.25 折算 CNY） -->
      <div class="card alloc-card">
        <div class="card-head">
          <div class="card-title">资产配置</div>
          <div class="card-sub">按市值 · CNY</div>
        </div>
        <div class="alloc-body">
          <div class="pie-chart donut" id="pie"></div>
          <ul class="pie-legend" id="legend"></ul>
        </div>
      </div>

      <!-- 持仓表（全列）-->
      <div class="card table-card">
        <div class="card-head">
          <div class="card-title">持仓明细</div>
          <div class="chips" id="chips"></div>
        </div>
        <table class="holdings-table">
          <thead>
            <tr>
              <th>证券 <span class="sort">↕</span></th>
              <th class="num">持有量 <span class="sort">↕</span></th>
              <th class="num">成本价 <span class="sort">↕</span></th>
              <th class="num">现价 <span class="sort">↕</span></th>
              <th class="num sorted">市值 <span class="sort">↓</span></th>
              <th>走势</th>
              <th class="num">盈亏 <span class="sort">↕</span></th>
              <th class="num">收益率 <span class="sort">↕</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="emptyWrap"></div>
      </div>
    </section>

    <!-- API: 多币种汇总（前端从 ListHoldings 折算） -->
    <!-- 多币种汇总条（底部）-->
    <div class="currency-bar desk-currency" id="currencyBar"></div>

  </main>
</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;

  /* —— 顶栏图标 —— */
  document.getElementById('iconSearch').innerHTML   = icon('search');
  document.getElementById('iconRefreshBtn').innerHTML = icon('refresh-cw');
  document.getElementById('iconWallet').innerHTML   = icon('briefcase');
  document.getElementById('iconLand').innerHTML     = icon('landmark');
  document.querySelectorAll('[data-icon]').forEach(function (el) {
    el.innerHTML = icon(el.getAttribute('data-icon'));
  });

  var SUMMARY = window.computeSummary();
  var ALLOC   = window.computeAllocation();
  var CHIPS   = window.computeChips();
  var upTotal = SUMMARY.totalPnlCNY >= 0;

  document.getElementById('countAll').textContent = window.HOLDINGS.length;

  /* —— StatCard 概览 4 格 —— */
  var stats = [
    { label: '总市值',   icon: 'wallet',
      value: window.fmtCNY(SUMMARY.totalMktCNY),
      sub: '<span class="cc">CNY</span> 折算合计', subCls: '' },
    { label: '总成本',   icon: 'banknote',
      value: window.fmtCNY(SUMMARY.totalCostCNY),
      sub: '<span class="cc">CNY</span> 投入本金', subCls: '' },
    { label: '总盈亏',   icon: upTotal ? 'trending-up' : 'trending-down',
      value: (upTotal ? '+' : '') + window.fmtCNY(Math.abs(SUMMARY.totalPnlCNY)),
      sub: '含已实现 + 浮动', subCls: upTotal ? 'pnl-up' : 'pnl-down',
      valCls: upTotal ? 'pnl-up' : 'pnl-down' },
    { label: '收益率',   icon: 'percent',
      value: window.fmtPct(SUMMARY.totalPnlPct),
      sub: '相对总成本', subCls: upTotal ? 'pnl-up' : 'pnl-down',
      valCls: upTotal ? 'pnl-up' : 'pnl-down' },
  ];
  document.getElementById('stats').innerHTML = stats.map(function (s) {
    return ''
      + '<div class="stat-card">'
      +   '<div class="stat-label">' + icon(s.icon) + s.label + '</div>'
      +   '<div class="stat-value ' + (s.valCls || '') + '">' + s.value + '</div>'
      +   '<div class="stat-sub ' + (s.subCls || '') + '">' + s.sub + '</div>'
      + '</div>';
  }).join('');

  /* —— 资产配置饼图（conic-gradient）—— */
  var pie = document.getElementById('pie');
  var stops = [];
  var acc = 0;
  ALLOC.filter(function (a) { return a.pct > 0; }).forEach(function (a) {
    var from = acc; acc += a.pct;
    stops.push(a.color + ' ' + from.toFixed(2) + '% ' + acc.toFixed(2) + '%');
  });
  pie.style.background = 'conic-gradient(' + (stops.join(', ') || '#e6e3dc 0 100%') + ')';
  var topAlloc = ALLOC.filter(function (a) { return a.pct > 0; }).sort(function (a, b) { return b.pct - a.pct; })[0];
  pie.innerHTML = ''
    + '<div class="pie-hole">'
    +   '<span class="pie-hole-pct">' + (topAlloc ? topAlloc.pct.toFixed(1) : '0') + '%</span>'
    +   '<span class="pie-hole-label">' + (topAlloc ? topAlloc.label : '无持仓') + '</span>'
    + '</div>';

  /* —— 图例 —— */
  document.getElementById('legend').innerHTML = ALLOC.map(function (a) {
    var dim = a.pct === 0;
    return ''
      + '<li>'
      +   '<span class="swatch" style="background:' + a.color + (dim ? ';opacity:.3' : '') + '"></span>'
      +   '<span class="leg-name ' + (dim ? 'legend-empty' : '') + '">' + a.label + '</span>'
      +   '<span class="leg-val ' + (dim ? 'legend-empty' : '') + '">' + (a.value > 0 ? window.fmtCNY(a.value) : '—') + '</span>'
      +   '<span class="leg-pct ' + (dim ? 'legend-empty' : '') + '">' + a.pct.toFixed(1) + '%</span>'
      + '</li>';
  }).join('');

  /* —— chips 筛选 —— */
  var chipBox = document.getElementById('chips');
  chipBox.innerHTML = CHIPS.map(function (c) {
    return '<button class="chip ' + (c.key === 'all' ? 'active' : '') + '" data-type="' + c.key + '">'
      + c.label + '<span class="cnt">' + c.count + '</span></button>';
  }).join('');

  /* —— 侧栏 nav（type 导航）—— */
  var navTypes = [
    { key: 'all',   label: '全部', icon: 'grid' },
    { key: 'stock', label: '股票', icon: 'trending-up' },
    { key: 'fund',  label: '基金', icon: 'pie-chart' },
    { key: 'etf',   label: 'ETF',  icon: 'landmark' },
    { key: 'bond',  label: '债券', icon: 'banknote' },
    { key: 'gold',  label: '黄金', icon: 'gem' },
  ];
  var navBox = document.getElementById('navList');
  navBox.innerHTML = navTypes.map(function (t) {
    var cnt = t.key === 'all'
      ? window.HOLDINGS.length
      : window.HOLDINGS.filter(function (h) { return window.SECURITIES[h.security_id].type === t.key; }).length;
    return '<div class="nav-item ' + (t.key === 'all' ? 'active' : '') + '" data-type="' + t.key + '">'
      + icon(t.icon) + '<span>' + t.label + '</span><span class="nav-cnt">' + cnt + '</span></div>';
  }).join('');

  /* —— 持仓表渲染 —— */
  function renderRows(filter) {
    var rows = window.HOLDINGS
      .map(function (h) { return window.holdingView(h); })
      .filter(function (v) { return filter === 'all' || v.sec.type === filter; })
      .sort(function (a, b) { return b.mktValCNY - a.mktValCNY; }); // 默认市值降序

    var tbody = document.getElementById('tbody');
    var emptyWrap = document.getElementById('emptyWrap');
    if (rows.length === 0) {
      tbody.innerHTML = '';
      emptyWrap.innerHTML = ''
        + '<div class="empty">'
        +   '<div class="empty-ico">' + icon('briefcase', 'icon-lg') + '</div>'
        +   '<div class="empty-title">该类型暂无持仓</div>'
        +   '<div class="empty-text">切换其他类型，或添加该类型的证券开始记录持仓。</div>'
        +   '<button class="btn btn-gold" style="margin-top:12px">' + icon('plus', 'icon-sm') + '添加持仓</button>'
        + '</div>';
      return;
    }
    emptyWrap.innerHTML = '';
    tbody.innerHTML = rows.map(function (v) {
      var typeTag = '<span class="type-tag">' + window.TYPE_META[v.sec.type].label + '</span>';
      return ''
        + '<tr>'
        +   '<td><div class="cell-sym"><span class="sym">' + v.sec.symbol + typeTag + '</span><span class="name">' + v.sec.name + '</span></div></td>'
        +   '<td class="num mono">' + v.h.quantity.toLocaleString('zh-CN') + '</td>'
        +   '<td class="num mono">' + window.fmtRaw(v.h.cost_price, v.h.currency) + '</td>'
        +   '<td class="num mono">' + window.fmtRaw(v.h.current_price, v.h.currency) + '</td>'
        +   '<td class="num mono">' + window.fmtCNY(v.mktValCNY) + '</td>'
        +   '<td>' + window.sparkSVG(v.h.sparkline, v.up, '', 104, 26) + '</td>'
        +   '<td class="num"><span class="pill ' + (v.up ? 'bg-up' : 'bg-down') + '">' + window.fmtSigned(v.pnl, 'CNY') + '</span></td>'
        +   '<td class="num mono ' + (v.up ? 'pnl-up' : 'pnl-down') + '">' + window.fmtPct(v.pnlPct) + '</td>'
        + '</tr>';
    }).join('');
  }

  /* —— 统一筛选：nav + chips 联动 —— */
  function setFilter(type) {
    document.querySelectorAll('.chip').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-type') === type);
    });
    document.querySelectorAll('.nav-item[data-type]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-type') === type);
    });
    renderRows(type);
  }
  chipBox.addEventListener('click', function (e) {
    var t = e.target.closest('.chip'); if (!t) return;
    setFilter(t.getAttribute('data-type'));
  });
  navBox.addEventListener('click', function (e) {
    var t = e.target.closest('.nav-item'); if (!t) return;
    setFilter(t.getAttribute('data-type'));
  });

  renderRows('all');

  /* —— 多币种汇总条 —— */
  var breakdown = window.computeCurrencyBreakdown();
  var curDetail = breakdown.map(function (b) {
    return '<div class="cb-cur"><span class="cb-cur-label">' + b.currency + '</span>'
      + '<span class="cb-cur-val">' + (b.currency === 'USD' ? '$' : '¥') + b.value.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</span></div>';
  }).join('');
  document.getElementById('currencyBar').innerHTML = ''
    + '<div class="cb-main"><span class="cb-label">本币合计 · CNY 总市值</span>'
    +   '<span class="cb-val">' + window.fmtCNY(SUMMARY.totalMktCNY) + '</span></div>'
    + '<div class="cb-divider"></div>'
    + '<div class="cb-detail">' + curDetail + '</div>'
    + '<div class="cb-rate">USD→CNY 7.25</div>';

})();
</script>
</body>
</html>
