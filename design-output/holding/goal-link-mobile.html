<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=410, initial-scale=1">
<title>御财 · 投资目标关联 — Mobile</title>

<!-- ======================================================================
     投资目标关联 · Mobile（<768px · 390×844 · 纵向卡片）
     ------------------------------------------------------------------------
     spec §6 投资目标关联(D 子项目 UI):mobile 纵向布局
       ① 概览头(达成统计,3 列紧凑)
       ② goal 紧凑卡片(目标名/状态/进度大数/市值/目标/关联/预计达成)
       ③ 卡片「切换关联」→ bottom sheet holding picker(mock · 切换重算)

     API 标注(spec §6): goal.backing_holding_id ⏳ D; 进度计算(市值 vs 目标) ⏳ D
     数据源: window.GOALS + window.HOLDINGS / window.SECURITIES / window.TYPE_META
     复用: styles.css(m-goal-overview / m-goal-card / sheet-overlay / api-note) + mock-data.js
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="d-mobile">

<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="11" width="3" height="9" rx="1"/><rect x="11" y="7" width="3" height="13" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="26" height="14"><rect x="2" y="4" width="18" height="16" rx="3"/><rect x="4.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 9v6" stroke-width="2"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="tb-title">
      <h1>投资目标</h1>
      <span class="tb-sub">持仓市值 vs 目标额 · ⏳ D</span>
    </div>
    <div class="tb-actions">
      <span class="icon-btn" id="addBtn"></span>
    </div>
  </header>

  <!-- 滚动区 -->
  <div class="scroll" id="scroll">

    <!-- ① 概览头(3 列紧凑) -->
    <section class="m-sec">
      <div class="m-goal-overview" id="goalOverview"></div>
    </section>

    <!-- ② goal 紧凑卡片列表 -->
    <div id="goalCards" style="display:flex;flex-direction:column;gap:12px;"></div>

    <!-- API 标注 -->
    <div class="api-note">
      <span class="icon" id="apiNoteIcon"></span>
      <span class="an-badge">⏳ D</span>
      <span>goal.backing_holding_id ⏳ D；进度/ETA 前端 mock，A-flutter 接后端。</span>
    </div>

    <div style="height:8px;"></div>
  </div>

  <!-- 底部 tabbar -->
  <nav class="tabbar">
    <div class="tab"><span data-icon="briefcase"></span>持仓</div>
    <div class="tab"><span data-icon="trending-up"></span>收益</div>
    <div class="tab"><span data-icon="plus"></span>交易</div>
    <div class="tab active"><span data-icon="gem"></span>目标</div>
    <div class="tab"><span data-icon="user"></span>我的</div>
  </nav>

</div>

<!-- holding picker bottom sheet -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet-panel">
    <div class="sheet-head">
      <div><h3 id="sheetTitle">切换关联持仓</h3><span class="tb-sub" id="sheetSub">选择 backing · 进度重算(mock)</span></div>
      <span class="sheet-close" id="sheetClose"></span>
    </div>
    <div class="gd-holding-picker" id="sheetPicker"></div>
  </div>
</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon   = window.icon;
  var fmtCNY = window.fmtCNY;
  var TYPE   = { stock: 't-stock', fund: 't-fund', etf: 't-etf', bond: 't-bond', gold: 't-gold' };
  var STATUS_META = {
    over:    { label: '超目标', icon: 'check-circle' },
    ontrack: { label: '进行中', icon: 'trending-up' },
    behind:  { label: '落后',   icon: 'alert-triangle' },
  };

  document.getElementById('addBtn').innerHTML = icon('plus');
  document.getElementById('apiNoteIcon').innerHTML = icon('info');
  document.getElementById('sheetClose').innerHTML = icon('x');
  document.getElementById('addBtn').addEventListener('click', toast('新建目标 ⏳ D'));
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetOverlay').addEventListener('click', function (e) {
    if (e.target === this) closeSheet();
  });
  document.querySelectorAll('.tabbar .tab span[data-icon]').forEach(function (s) {
    s.innerHTML = icon(s.dataset.icon);
  });

  function toast(msg) {
    return function () {
      var t = document.createElement('div');
      t.innerHTML = icon('info') + msg;
      t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9999px;background:#1c1e21;color:#fff;font-size:12px;box-shadow:0 12px 32px rgba(40,35,25,.12);';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 1600);
    };
  }
  function flashToast(msg) {
    var t = document.createElement('div');
    t.innerHTML = icon('check-circle') + msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9999px;background:var(--up);color:#fff;font-size:12px;box-shadow:0 12px 32px rgba(40,35,25,.18);';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1600);
  }

  function stats() {
    var over = 0, ontrack = 0, behind = 0, totalCurrent = 0, totalTarget = 0;
    window.GOALS.forEach(function (g) {
      var v = window.goalView(g.id);
      if (v.status === 'over') over++; else if (v.status === 'ontrack') ontrack++; else behind++;
      totalCurrent += g.current_market_value_cents;
      totalTarget  += g.target_cents;
    });
    return { total: window.GOALS.length, over: over, ontrack: ontrack, behind: behind,
      totalCurrent: totalCurrent, totalTarget: totalTarget,
      pct: totalTarget > 0 ? (totalCurrent / totalTarget) * 100 : 0 };
  }

  function renderOverview() {
    var st = stats();
    document.getElementById('goalOverview').innerHTML =
        '<div class="go-cell"><span class="go-label">总数</span><span class="go-val">' + st.total + '</span><span class="go-sub">holding-backed</span></div>'
      + '<div class="go-cell"><span class="go-label">超/中</span><span class="go-val gold">' + (st.over + st.ontrack) + '</span><span class="go-sub">达成中</span></div>'
      + '<div class="go-cell"><span class="go-label">落后</span><span class="go-val down">' + st.behind + '</span><span class="go-sub">需加码</span></div>';
  }

  function renderCards() {
    var html = window.GOALS.map(function (g) {
      var v = window.goalView(g.id);
      var sec = v.security;
      var meta = sec ? window.TYPE_META[sec.type] : null;
      var dotColor = meta ? meta.color : 'var(--muted-2)';
      var sMeta = STATUS_META[v.status];
      var pctClamped = Math.min(100, v.pct);
      var barColor = v.status === 'over' ? 'linear-gradient(90deg,var(--up-soft),var(--up))'
                   : v.status === 'ontrack' ? 'linear-gradient(90deg,var(--gold-soft),var(--gold))'
                   : 'linear-gradient(90deg,var(--down-soft),var(--down))';
      return '<div class="m-goal-card ' + v.status + '">'
        +   '<div class="mgc-top">'
        +     '<div><div class="mgc-name">' + icon('gem') + g.name + '</div>'
        +       '<div style="font-size:11px;color:var(--muted);margin-top:2px;margin-left:19px;">' + (g.note || '—') + '</div>'
        +     '</div>'
        +     '<span class="status-pill ' + v.status + '">' + icon(sMeta.icon) + sMeta.label + '</span>'
        +   '</div>'
        +   '<div class="mgc-progress-track"><div class="mgc-progress-fill" style="width:' + pctClamped + '%;background:' + barColor + ';"></div></div>'
        +   '<div class="mgc-pct-row">'
        +     '<span class="mgc-pct">' + v.pct.toFixed(1) + '%</span>'
        +     '<span class="mgc-vals"><strong>' + fmtCNY(g.current_market_value_cents / 100) + '</strong> / ' + fmtCNY(g.target_cents / 100) + '</span>'
        +   '</div>'
        +   '<div class="mgc-meta">'
        +     '<div class="mgc-meta-row"><span class="mmk">' + icon('link') + '关联持仓</span>'
        +       '<span class="mmv"><span class="tc-dot" style="background:' + dotColor + '"></span>' + (sec ? sec.symbol + ' · ' + sec.name : '未关联') + '</span>'
        +     '</div>'
        +     '<div class="mgc-meta-row"><span class="mmk">' + icon('calendar') + '预计达成</span>'
        +       '<span class="mmv">' + (v.eta || '—') + '</span>'
        +     '</div>'
        +     '<div class="mgc-meta-row"><span class="mmk">' + icon('flag') + '截止</span>'
        +       '<span class="mmv">' + g.deadline + '</span>'
        +     '</div>'
        +   '</div>'
        +   '<div class="mgc-foot">'
        +     '<button class="gd-link-btn" data-pick="' + g.id + '">' + icon('swap') + '切换关联</button>'
        +     '<button class="gd-link-btn" data-edit="' + g.id + '">' + icon('pencil') + '编辑</button>'
        +   '</div>'
        + '</div>';
    }).join('') || ('<div class="goal-empty"><div class="ge-icon">' + icon('gem') + '</div>'
      + '<div class="ge-title">暂无投资目标</div>'
      + '<div class="ge-text">点击右上 + 新建</div></div>');
    document.getElementById('goalCards').innerHTML = html;

    document.querySelectorAll('[data-pick]').forEach(function (btn) {
      btn.addEventListener('click', function () { openSheet(btn.dataset.pick); });
    });
    document.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () { toast('编辑目标 ⏳ D')(); });
    });
  }

  /* —— holding picker bottom sheet —— */
  var sheetOverlay = document.getElementById('sheetOverlay');
  function openSheet(gid) {
    var g = window.GOALS.find(function (x) { return x.id === gid; });
    document.getElementById('sheetTitle').textContent = g.name + ' · 切换关联';
    document.getElementById('sheetSub').textContent = '当前 ' + fmtCNY(g.current_market_value_cents / 100) + ' · 选择 backing 重算(mock)';
    var html = window.HOLDINGS.map(function (h) {
      var s = window.SECURITIES[h.security_id];
      var m = window.TYPE_META[s.type];
      var mktCNY = window.toCNY(h.quantity * h.current_price, h.currency);
      var isSel = h.id === g.backing_holding_id;
      return '<div class="gd-hp-row' + (isSel ? ' selected' : '') + '" data-h="' + h.id + '">'
        +   '<span class="gd-hp-radio">' + icon('check') + '</span>'
        +   '<div class="gd-hp-info">'
        +     '<span class="gd-hp-sym"><span class="tc-dot" style="background:' + m.color + '"></span>' + s.symbol + '</span>'
        +     '<span class="gd-hp-name">' + s.name + '</span>'
        +   '</div>'
        +   '<span class="gd-hp-val">' + fmtCNY(mktCNY) + '<span class="gd-hp-cur"> CNY</span></span>'
        + '</div>';
    }).join('');
    var picker = document.getElementById('sheetPicker');
    picker.innerHTML = html;
    picker.querySelectorAll('.gd-hp-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var hid = row.dataset.h;
        var h = window.HOLDINGS.find(function (x) { return x.id === hid; });
        g.backing_holding_id = hid;
        g.current_market_value_cents = Math.round(window.toCNY(h.quantity * h.current_price, h.currency) * 100);
        flashToast('已切换 → ' + window.SECURITIES[h.security_id].symbol + ' · 重算(mock)');
        closeSheet();
        renderCards();
        renderOverview();
      });
    });
    sheetOverlay.classList.add('open');
  }
  function closeSheet() { sheetOverlay.classList.remove('open'); }

  renderOverview();
  renderCards();
})();
</script>
</body>
</html>
