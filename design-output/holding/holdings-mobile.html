<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=410, initial-scale=1">
<title>御财 · 持仓列表 — Mobile</title>

<!-- ======================================================================
     API 标注
     · API: ListHoldings(tenant_id, type_filter?)                    ✅ A-server 已实现
     · API: 聚合统计 / 资产配置占比 / 多币种汇总                         ⏳ 首批前端从 ListHoldings
           计算（server summary 端点后置）
     · 数据源：window.HOLDINGS / window.SECURITIES / window.ACCOUNTS（mock-data.js）
     · 汇率：USD → CNY = 7.25
     · P&L 用平均成本 mock（holdingView：pnl = mktVal − cost，非 FIFO），
       A-flutter 接 ⏳C snapshot 替换（FIFO/移动加权由 server 计算）
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="d-mobile">

<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <!-- 信号 -->
      <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="11" width="3" height="9" rx="1"/><rect x="11" y="7" width="3" height="13" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/></svg>
      <!-- wifi -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
      <!-- 电池 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="26" height="14"><rect x="2" y="4" width="18" height="16" rx="3"/><rect x="4.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 9v6" stroke-width="2"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="tb-title">
      <h1>持仓</h1>
      <span class="tb-sub"><span id="countAll" class="mono">0</span> 只 · <span id="totalShort" class="mono">—</span></span>
    </div>
    <div class="tb-actions">
      <span class="icon-btn" id="iconSearchBtn"></span>
      <span class="icon-btn" id="addTopBtn"></span>
    </div>
  </header>

  <!-- 滚动区 -->
  <div class="scroll" id="scroll">

    <!-- API: 概览统计 -->
    <!-- StatCard 2×2 -->
    <section class="m-sec">
      <div class="m-stats" id="stats"></div>
    </section>

    <!-- 资产配置（可折叠）-->
    <!-- API: 资产配置占比（前端聚合，USD 按 7.25 折算） -->
    <section class="m-sec">
      <div class="card m-alloc" id="allocCard">
        <div class="m-sec-h" id="allocToggle" style="cursor:pointer">
          <h3>资产配置</h3>
          <span class="m-link" id="allocChev"></span>
        </div>
        <div class="alloc-body vertical" id="allocBody">
          <div class="pie-chart donut size-sm" id="pie" style="margin:0 auto"></div>
          <ul class="pie-legend" id="legend"></ul>
        </div>
      </div>
    </section>

    <!-- chips 筛选（横滚）-->
    <div class="chips scroll-x m-chips" id="chips"></div>

    <!-- 持仓卡片行 -->
    <!-- API: ListHoldings 持仓明细 -->
    <section class="m-sec">
      <div class="m-sec-h"><h3>持仓明细</h3><span class="m-link">按市值</span></div>
      <div class="acc-list" id="accList"></div>
    </section>

    <!-- 多币种汇总 -->
    <div class="m-currency" id="currencyBar"></div>

  </div>

  <!-- FAB 触发交易 Sheet / 添加持仓 -->
  <button class="fab" id="fab" title="添加持仓 / 交易">
    <span class="icon" data-icon="plus"></span>
  </button>

  <!-- 底部 tabbar -->
  <nav class="tabbar">
    <div class="tab active"><span data-icon="briefcase"></span>持仓</div>
    <div class="tab"><span data-icon="trending-up"></span>行情</div>
    <div class="tab"><span data-icon="plus"></span>交易</div>
    <div class="tab"><span data-icon="pie-chart"></span>资产</div>
    <div class="tab"><span data-icon="user"></span>我的</div>
  </nav>

</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;
  document.getElementById('iconSearchBtn').innerHTML = icon('search');
  document.getElementById('addTopBtn').innerHTML     = icon('plus');
  document.getElementById('allocChev').innerHTML     = icon('chevron-up');
  document.querySelectorAll('[data-icon]').forEach(function (el) {
    el.innerHTML = icon(el.getAttribute('data-icon'));
  });

  var SUMMARY = window.computeSummary();
  var ALLOC   = window.computeAllocation();
  var CHIPS   = window.computeChips();
  var upTotal = SUMMARY.totalPnlCNY >= 0;

  document.getElementById('countAll').textContent = window.HOLDINGS.length;
  document.getElementById('totalShort').textContent = window.fmtCNY(SUMMARY.totalMktCNY);

  /* StatCard 2×2 */
  var stats = [
    { label: '总市值', icon: 'wallet',   value: window.fmtCNY(SUMMARY.totalMktCNY),  valCls: '', sub: '' },
    { label: '总成本', icon: 'banknote', value: window.fmtCNY(SUMMARY.totalCostCNY),valCls: '', sub: '' },
    { label: '总盈亏', icon: upTotal ? 'trending-up' : 'trending-down',
      value: (upTotal ? '+' : '') + window.fmtCNY(Math.abs(SUMMARY.totalPnlCNY)),
      valCls: upTotal ? 'pnl-up' : 'pnl-down', sub: upTotal ? 'pnl-up' : 'pnl-down' },
    { label: '收益率', icon: 'percent',  value: window.fmtPct(SUMMARY.totalPnlPct),
      valCls: upTotal ? 'pnl-up' : 'pnl-down', sub: upTotal ? 'pnl-up' : 'pnl-down' },
  ];
  document.getElementById('stats').innerHTML = stats.map(function (s) {
    return '<div class="stat-card">'
      + '<div class="stat-label">' + icon(s.icon) + s.label + '</div>'
      + '<div class="stat-value ' + (s.valCls || '') + '">' + s.value + '</div>'
      + '</div>';
  }).join('');

  /* 饼图 */
  var pie = document.getElementById('pie');
  var stops = [], acc = 0;
  ALLOC.filter(function (a) { return a.pct > 0; }).forEach(function (a) {
    var from = acc; acc += a.pct;
    stops.push(a.color + ' ' + from.toFixed(2) + '% ' + acc.toFixed(2) + '%');
  });
  pie.style.background = 'conic-gradient(' + (stops.join(', ') || '#e6e3dc 0 100%') + ')';
  var top = ALLOC.filter(function (a) { return a.pct > 0; }).sort(function (a, b) { return b.pct - a.pct; })[0];
  pie.innerHTML = '<div class="pie-hole"><span class="pie-hole-pct">' + (top ? top.pct.toFixed(1) : '0') + '%</span>'
    + '<span class="pie-hole-label">' + (top ? top.label : '无') + '</span></div>';

  document.getElementById('legend').innerHTML = ALLOC.map(function (a) {
    var dim = a.pct === 0;
    return '<li>'
      + '<span class="swatch" style="background:' + a.color + (dim ? ';opacity:.3' : '') + '"></span>'
      + '<span class="leg-name ' + (dim ? 'legend-empty' : '') + '">' + a.label + '</span>'
      + '<span class="leg-pct ' + (dim ? 'legend-empty' : '') + '">' + a.pct.toFixed(1) + '%</span>'
      + '</li>';
  }).join('');

  /* 饼图折叠 */
  var allocOpen = true;
  document.getElementById('allocToggle').addEventListener('click', function () {
    allocOpen = !allocOpen;
    document.getElementById('allocBody').style.display = allocOpen ? '' : 'none';
    document.getElementById('allocChev').innerHTML = icon(allocOpen ? 'chevron-up' : 'chevron-down');
  });

  /* chips 横滚 */
  var chipBox = document.getElementById('chips');
  chipBox.innerHTML = CHIPS.map(function (c) {
    return '<button class="chip ' + (c.key === 'all' ? 'active' : '') + '" data-type="' + c.key + '">'
      + c.label + '<span class="cnt">' + c.count + '</span></button>';
  }).join('');

  /* 持仓卡片行 */
  function renderCards(filter) {
    var rows = window.HOLDINGS.map(function (h) { return window.holdingView(h); })
      .filter(function (v) { return filter === 'all' || v.sec.type === filter; })
      .sort(function (a, b) { return b.mktValCNY - a.mktValCNY; });
    var box = document.getElementById('accList');
    if (!rows.length) {
      box.innerHTML = '<div class="empty"><div class="empty-ico">' + icon('briefcase', 'icon-lg') + '</div>'
        + '<div class="empty-title">该类型暂无持仓</div>'
        + '<div class="empty-text">切换其他类型，或点击右下角 + 添加。</div>'
        + '<button class="btn btn-gold" style="margin-top:12px">' + icon('plus', 'icon-sm') + '添加持仓</button></div>';
      return;
    }
    box.innerHTML = rows.map(function (v) {
      var typeTag = '<span class="type-tag">' + window.TYPE_META[v.sec.type].label + '</span>';
      return '<div class="acc">'
        + '<div class="acc-top">'
        +   '<div class="acc-left"><span class="acc-sym">' + v.sec.symbol + typeTag + '</span><span class="acc-name">' + v.sec.name + '</span></div>'
        +   '<div class="acc-right"><span class="acc-val">' + window.fmtCNY(v.mktValCNY) + '</span><span class="cc" style="font-size:11px">现价 ' + window.fmtRaw(v.h.current_price, v.h.currency) + '</span></div>'
        + '</div>'
        + '<div class="acc-mid">'
        +   window.sparkSVG(v.h.sparkline, v.up, 'acc-spark', 96, 30)
        +   '<span class="acc-pill ' + (v.up ? 'bg-up' : 'bg-down') + '">' + icon(v.up ? 'trending-up' : 'trending-down', 'icon-sm') + window.fmtPct(v.pnlPct) + '</span>'
        + '</div>'
        + '<div class="acc-meta">'
        +   '<div class="kv"><span class="k">持有量</span><span class="v">' + v.h.quantity.toLocaleString('zh-CN') + '</span></div>'
        +   '<div class="kv"><span class="k">成本价</span><span class="v">' + window.fmtRaw(v.h.cost_price, v.h.currency) + '</span></div>'
        +   '<div class="kv"><span class="k">盈亏</span><span class="v ' + (v.up ? 'pnl-up' : 'pnl-down') + '">' + window.fmtSigned(v.pnl, 'CNY') + '</span></div>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  chipBox.addEventListener('click', function (e) {
    var t = e.target.closest('.chip'); if (!t) return;
    document.querySelectorAll('.chip').forEach(function (el) {
      el.classList.toggle('active', el === t);
    });
    renderCards(t.getAttribute('data-type'));
  });

  renderCards('all');

  /* 多币种汇总 */
  var breakdown = window.computeCurrencyBreakdown();
  var curDetail = breakdown.map(function (b) {
    return '<div class="mc-cur"><span class="k">' + b.currency + '</span>'
      + '<span class="v">' + (b.currency === 'USD' ? '$' : '¥') + b.value.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</span></div>';
  }).join('');
  document.getElementById('currencyBar').innerHTML = ''
    + '<div class="mc-top"><span class="mc-label">本币合计 · CNY</span><span class="mc-rate">USD→CNY 7.25</span></div>'
    + '<div class="mc-val">' + window.fmtCNY(SUMMARY.totalMktCNY) + '</div>'
    + '<div class="mc-detail">' + curDetail + '</div>';
})();
</script>
</body>
</html>
