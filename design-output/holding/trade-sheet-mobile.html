<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>交易 Sheet · Mobile · 御财持仓</title>
<!--
  ============================================================================
  交易 Sheet · Mobile（<768px · 全屏 step wizard,非 bottom sheet）
  5 步进度条: ① 选类型 → ② security → ③ 账户 → ④ 数量价格 → ⑤ 确认
  ----------------------------------------------------------------------------
  API 标注（对照 spec §2）:
    - BuyHolding(...)  ✅ 已实现（双写 credit from + debit holding）
    - SellHolding(...) ✅ 已实现（双写 debit from + credit holding）
    - RecordDividend(...) ✅ proto / ⏳ handler 双写待 income account 设计
    - RecordSplit(...) ⏳ 待实现（无现金流）
    - from_account_id 必填（A-server 已加，Dart stub 需 buf generate 重生成）
    - 跨币种(security vs account) → from-account picker 客户端预校验 disabled
  Mock: 默认演示 buy AAPL(USD)×a1×qty10×price185×fee5 → $1,855 | 余额 $5,000→$3,145
  ============================================================================
-->
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg-deep); padding: 0; }
  .demo-canvas {
    width: 390px; margin: 24px auto; display: flex; justify-content: center;
  }
  /* wizard 在 phone 容器内 */
  .phone .wizard { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* 把 topbar 让位给 wizard 顶部的返回+进度条 */
  .phone .wiz-top {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 6px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .phone .wiz-top .back-btn {
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; border: none; background: transparent; color: var(--fg); cursor: pointer;
  }
  .phone .wiz-top .wt-title { font-family: var(--font-serif); font-size: 16px; color: var(--fg-strong); }
  .phone .wiz-top .wt-type-tag {
    margin-left: auto; font-size: 11px; padding: 2px 9px; border-radius: var(--r-pill);
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="demo-canvas">
  <div class="phone">

    <!-- statusbar -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-icons">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.97 0 9-4.03 9-9 0-4.97-4.03-9-9-9-4.97 0-9 4.03-9 9 0 4.97 4.03 9 9 9z"/><path d="M12 18a6 6 0 0 0 6-6"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>
      </span>
    </div>

    <!-- wizard top: back + title -->
    <div class="wiz-top">
      <button class="back-btn" aria-label="返回" onclick="goBack()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="wt-title">记录交易</span>
      <span class="wt-type-tag" id="wtTypeTag" style="background:var(--buy-soft);color:var(--buy)">买入</span>
    </div>

    <div class="wizard">

      <!-- progress -->
      <div class="wiz-progress">
        <div class="wp-steps">
          <div class="wp-step current" data-step="1"></div>
          <div class="wp-step"        data-step="2"></div>
          <div class="wp-step"        data-step="3"></div>
          <div class="wp-step"        data-step="4"></div>
          <div class="wp-step"        data-step="5"></div>
        </div>
        <div class="wp-labels">
          <span class="active" data-step="1">类型</span>
          <span data-step="2">证券</span>
          <span data-step="3">账户</span>
          <span data-step="4">数量价格</span>
          <span data-step="5">确认</span>
        </div>
        <div class="wp-title" id="wpTitle">选择交易类型</div>
      </div>

      <!-- body -->
      <div class="wiz-body" id="wizBody">

        <!-- ===== STEP 1: 选类型 ===== -->
        <div class="wiz-step" data-step="1">
          <div class="type-cards">
            <div class="type-card t-buy selected" data-type="buy" onclick="pickType('buy')">
              <div class="tc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="m9 13 3 3 3-3"/></svg></div>
              <span class="tc-name">买入</span>
              <span class="tc-desc">资金扣减<br>持仓增加</span>
            </div>
            <div class="type-card t-sell" data-type="sell" onclick="pickType('sell')">
              <div class="tc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16V8"/><path d="m9 11 3-3 3 3"/></svg></div>
              <span class="tc-name">卖出</span>
              <span class="tc-desc">资金入账<br>持仓减少</span>
            </div>
            <div class="type-card t-dividend" data-type="dividend" onclick="pickType('dividend')">
              <div class="tc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg></div>
              <span class="tc-name">分红</span>
              <span class="tc-desc">入 income<br>账户</span>
            </div>
            <div class="type-card t-split" data-type="split" onclick="pickType('split')">
              <div class="tc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg></div>
              <span class="tc-name">拆分</span>
              <span class="tc-desc">调整量/成本<br>无现金流</span>
            </div>
          </div>
        </div>

        <!-- ===== STEP 2: security ===== -->
        <div class="wiz-step" data-step="2" style="display:none">
          <div class="field">
            <label class="field-label">选择证券 <span class="req">*</span></label>
            <div class="sec-picker">
              <div class="input" id="secDisplay" onclick="toggleSecMenu()">
                <div class="sp-display">
                  <span class="sp-sym" id="secSym">AAPL</span>
                  <span class="sp-name" id="secName">Apple Inc.</span>
                  <span class="sp-tag" id="secTag">stock · USD</span>
                </div>
                <svg class="sp-caret icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </div>
              <div class="sec-menu" id="secMenu" style="display:none"></div>
            </div>
          </div>
          <!-- split 在 step2 直接配比例（无账户步骤） -->
          <div id="splitRatioBox" style="display:none">
            <div class="field" style="margin-top:14px">
              <label class="field-label">拆分比例（从 → 至）<span class="req">*</span></label>
              <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
                <input class="input mono" type="number" id="ratioFrom" value="1" min="1" step="1" oninput="recalcSplit()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--split)"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                <input class="input mono" type="number" id="ratioTo" value="2" min="1" step="1" oninput="recalcSplit()">
              </div>
            </div>
            <div class="split-preview" style="margin-top:14px">
              <div class="sp-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
                拆分预览（无现金流）
              </div>
              <div class="split-grid">
                <div class="split-cell"><span class="sc-label">拆分前</span><span class="sc-val from" id="splitQtyBefore">50 股</span><span class="sc-label" style="margin-top:6px">成本</span><span class="sc-val from" id="splitCostBefore">$170.00</span></div>
                <div class="split-cell"><span class="sc-label">拆分后</span><span class="sc-val" id="splitQtyAfter">100 股</span><span class="sc-label" style="margin-top:6px">成本</span><span class="sc-val" id="splitCostAfter">$85.00</span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ===== STEP 3: 账户 ===== -->
        <div class="wiz-step" data-step="3" style="display:none">
          <div class="field">
            <label class="field-label"><span id="acctStepLabel">资金账户</span> <span class="req">*</span>
              <span class="field-hint">币种一致 · 跨币种 disabled</span>
            </label>
            <div class="acct-list" id="acctList"></div>
          </div>
        </div>

        <!-- ===== STEP 4: 数量/价格 (buy/sell) 或 股息(dividend) ===== -->
        <div class="wiz-step" data-step="4" style="display:none">
          <!-- buy/sell -->
          <div id="qtyPriceBox">
            <div class="field">
              <label class="field-label">数量 <span class="req">*</span></label>
              <div class="input-affix">
                <input class="input mono has-r" type="number" id="qty" value="10" min="0" step="1" oninput="recalc()">
                <span class="affix right">股</span>
              </div>
            </div>
            <div class="field">
              <label class="field-label">价格 <span class="req">*</span></label>
              <div class="input-affix">
                <span class="affix left" id="priceSym">$</span>
                <input class="input mono has-l" type="number" id="price" value="185.00" min="0" step="0.01" oninput="recalc()">
              </div>
            </div>
            <div class="field">
              <label class="field-label">交易费用</label>
              <div class="input-affix">
                <span class="affix left" id="feeSym">$</span>
                <input class="input mono has-l" type="number" id="fee" value="5.00" min="0" step="0.01" oninput="recalc()">
              </div>
            </div>
            <div class="field">
              <label class="field-label">日期 <span class="req">*</span></label>
              <input class="input mono" type="date" id="date" value="2026-06-29">
            </div>
          </div>
          <!-- dividend -->
          <div id="divBox" style="display:none">
            <div class="field">
              <label class="field-label">每股股息 <span class="req">*</span></label>
              <div class="input-affix">
                <span class="affix left" id="divSym">¥</span>
                <input class="input mono has-l" type="number" id="perShare" value="0.30" min="0" step="0.001" oninput="recalcDiv()">
              </div>
            </div>
            <div class="field">
              <label class="field-label">持有量 <span class="field-hint">自动</span></label>
              <div class="input-affix">
                <input class="input mono has-r" type="number" id="divQty" readonly>
                <span class="affix right">股</span>
              </div>
            </div>
            <div class="field">
              <label class="field-label">除权日期 <span class="req">*</span></label>
              <input class="input mono" type="date" id="divDate" value="2026-06-29">
            </div>
          </div>
        </div>

        <!-- ===== STEP 5: 确认 ===== -->
        <div class="wiz-step" data-step="5" style="display:none">
          <div id="confirmBox"></div>
        </div>

      </div>

      <!-- wizard foot -->
      <div class="wiz-foot" id="wizFoot">
        <button class="btn" id="prevBtn" onclick="goPrev()" style="display:none">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          上一步
        </button>
        <button class="btn btn-primary" id="nextBtn" onclick="goNext()">下一步</button>
      </div>

    </div>
  </div>
</div>

<script src="mock-data.js"></script>
<script>
var ACCT_BAL = { a1: 5000, a2: 80000, a3: 0 };
var state = { step:1, type:'buy', secId:'s1', acctId:'a1', incomeAcctId:'a3', splitRatioFrom:1, splitRatioTo:2 };
function $(id){ return document.getElementById(id); }
function fmt(v, cur){ return window.fmtRaw(v, cur); }
function curOf(secId){ return window.SECURITIES[secId].currency; }

/* 类型选择 */
function pickType(t){
  state.type = t;
  document.querySelectorAll('.type-card').forEach(function(c){
    c.classList.toggle('selected', c.dataset.type === t);
  });
  // 顶部 tag
  var tag = $('wtTypeTag');
  var meta = {
    buy:      { name:'买入',   bg:'var(--buy-soft)',      fg:'var(--buy)' },
    sell:     { name:'卖出',   bg:'var(--sell-soft)',     fg:'var(--sell)' },
    dividend: { name:'分红',   bg:'var(--dividend-soft)', fg:'var(--dividend)' },
    split:    { name:'拆分',   bg:'var(--split-soft)',    fg:'var(--split)' }
  }[t];
  tag.textContent = meta.name; tag.style.background = meta.bg; tag.style.color = meta.fg;
}

/* security menu */
function buildSecMenu(menuEl, onPick){
  menuEl.innerHTML = '';
  Object.keys(window.SECURITIES).forEach(function(sid){
    var s = window.SECURITIES[sid];
    var item = document.createElement('div');
    item.className = 'sm-item';
    item.innerHTML = '<span class="sm-sym">'+s.symbol+'</span><span class="sm-name">'+s.name+'</span><span class="sm-cur">'+s.currency+' · '+window.TYPE_META[s.type].label+'</span>';
    item.onclick = function(){ onPick(sid); menuEl.style.display='none'; };
    menuEl.appendChild(item);
  });
}
function toggleSecMenu(){
  var m=$('secMenu'); if(!m.dataset.built){ buildSecMenu(m, pickSec); m.dataset.built='1'; }
  m.style.display = (m.style.display==='block') ? 'none' : 'block';
}
function renderSecDisplay(secId){
  var s = window.SECURITIES[secId];
  $('secSym').textContent = s.symbol; $('secName').textContent = s.name;
  $('secTag').textContent = window.TYPE_META[s.type].label + ' · ' + s.currency;
  $('priceSym').textContent = s.currency==='USD' ? '$' : '¥';
  $('feeSym').textContent   = s.currency==='USD' ? '$' : '¥';
  $('divSym').textContent   = s.currency==='USD' ? '$' : '¥';
}
function pickSec(sid){ state.secId = sid; renderSecDisplay(sid); if(state.type==='split') recalcSplit(); }

/* account list (step 3) */
function renderAcctList(){
  var secCur = curOf(state.secId);
  var list = $('acctList'); list.innerHTML = '';
  // dividend 用 income 账户；buy/sell 用 asset 账户
  var pool = state.type==='dividend'
    ? Object.keys(window.ACCOUNTS).filter(function(aid){ return window.ACCOUNTS[aid].kind==='income'; })
    : ['a1','a2'];
  $('acctStepLabel').textContent = state.type==='dividend' ? '分红入账账户' : '资金账户';

  pool.forEach(function(aid){
    var a = window.ACCOUNTS[aid];
    var disabled = a.currency !== secCur;
    var selKey = state.type==='dividend' ? 'incomeAcctId' : 'acctId';
    var sel = (!disabled && state[selKey] === aid);
    var div = document.createElement('div');
    div.className = 'acct-opt' + (sel?' selected':'') + (disabled?' disabled':'');
    var balHtml = (state.type!=='dividend')
      ? '<span class="ao-bal">'+fmt(ACCT_BAL[aid]||0, a.currency)+'</span>'
      : '';
    var kindTag = a.kind==='income' ? ' <span style="font-size:10px;color:var(--gold-deep);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:4px">income</span>' : '';
    div.innerHTML =
      '<span class="ao-radio"></span>' +
      '<div class="ao-body"><span class="ao-name">'+a.name+kindTag+'</span><span class="ao-meta">'+a.broker+'</span></div>' +
      '<span class="ao-cur">'+a.currency+'</span>' + balHtml;
    if(!disabled){
      div.onclick = function(){ state[selKey] = aid; renderAcctList(); };
    }
    list.appendChild(div);
  });
  // 跨币种提示
  var mismatch = ['a1','a2'].filter(function(aid){ return window.ACCOUNTS[aid].currency !== secCur; });
  if(mismatch.length && state.type!=='dividend'){
    var w = document.createElement('div'); w.className = 'acct-warn';
    w.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'+mismatch.length+' 个账户币种与证券（'+secCur+'）不一致，已 disabled';
    list.appendChild(w);
  }
}

/* recalc (buy/sell) */
function recalc(){}
function recalcDiv(){
  // 这里 step4 切换 dividend 时同步 divQty 显示
  var sid = state.secId;
  var h = window.HOLDINGS.find(function(x){ return x.security_id===sid; });
  $('divQty').value = h ? h.quantity : 0;
}
function recalcSplit(){
  state.splitRatioFrom = parseFloat($('ratioFrom').value) || 1;
  state.splitRatioTo   = parseFloat($('ratioTo').value)   || 1;
  var h = window.HOLDINGS.find(function(x){ return x.security_id===state.secId; });
  var qty = h ? h.quantity : 0; var cost = h ? h.cost_price : 0;
  var mult = state.splitRatioFrom > 0 ? state.splitRatioTo/state.splitRatioFrom : 1;
  var secCur = curOf(state.secId);
  $('splitQtyBefore').textContent = qty + ' 股';
  $('splitCostBefore').textContent = fmt(cost, secCur);
  $('splitQtyAfter').textContent = (qty*mult) + ' 股';
  $('splitCostAfter').textContent = fmt(cost/mult, secCur);
}

/* step navigation */
var STEP_TITLES = {
  1: function(){ return '选择交易类型'; },
  2: function(){ return state.type==='split' ? '证券 · 拆分比例' : '选择证券'; },
  3: function(){ return state.type==='dividend' ? '分红入账账户' : '资金账户'; },
  4: function(){ return state.type==='dividend' ? '股息 · 日期' : '数量 · 价格 · 费用'; },
  5: function(){ return '确认提交'; },
};

function renderStep(){
  // progress
  document.querySelectorAll('.wp-step').forEach(function(b){
    var s = parseInt(b.dataset.step);
    b.classList.toggle('done',    s < state.step);
    b.classList.toggle('current', s === state.step);
  });
  document.querySelectorAll('.wp-labels span').forEach(function(b){
    var s = parseInt(b.dataset.step);
    b.classList.toggle('active', s === state.step);
  });
  $('wpTitle').textContent = STEP_TITLES[state.step]();

  // step bodies
  document.querySelectorAll('.wiz-step').forEach(function(b){
    b.style.display = (parseInt(b.dataset.step) === state.step) ? '' : 'none';
  });

  // split 跳过 step3(账户):在 step2 内嵌比例;dividend 走 income 账户(step3)
  $('splitRatioBox').style.display = (state.step===2 && state.type==='split') ? '' : 'none';

  // step4 显示哪个 box
  if(state.step===4){
    $('qtyPriceBox').style.display = (state.type==='dividend') ? 'none' : '';
    $('divBox').style.display       = (state.type==='dividend') ? '' : 'none';
    if(state.type==='dividend') recalcDiv();
  }

  // step5 confirm
  if(state.step===5) renderConfirm();

  // foot buttons
  $('prevBtn').style.display = (state.step===1) ? 'none' : '';
  // split 的 step3 跳过 → 在 step2 直接可下一步到 step4; 但 split 只有 type/sec/确认 → 简化为 step1→2→5
  // next label
  var next = $('nextBtn');
  if(state.step===5){
    next.textContent = '确认提交';
  } else {
    next.innerHTML = '下一步 <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  }

  // step3 渲染账户列表
  if(state.step===3) renderAcctList();
}

function goNext(){
  // split 路径: 1 → 2 → 5（跳过账户与数量价格）
  if(state.type==='split'){
    if(state.step===1){ state.step=2; renderStep(); return; }
    if(state.step===2){ recalcSplit(); state.step=5; renderStep(); return; }
    if(state.step===5){ doSubmit(); return; }
  }
  // dividend 路径: 1 → 2 → 3 → 4 → 5
  // buy/sell 路径: 1 → 2 → 3 → 4 → 5
  if(state.step < 5){ state.step++; renderStep(); }
  else { doSubmit(); }
}
function goPrev(){
  if(state.type==='split'){
    if(state.step===5){ state.step=2; renderStep(); return; }
    if(state.step===2){ state.step=1; renderStep(); return; }
    return;
  }
  if(state.step > 1){ state.step--; renderStep(); }
}
function goBack(){
  // 顶部返回:退一步或退出
  if(state.step===1){ alert('[mock] 关闭 wizard'); return; }
  goPrev();
}

/* step5 confirm 渲染 */
function renderConfirm(){
  var secCur = curOf(state.secId);
  var sec = window.SECURITIES[state.secId];
  var html = '';
  var apiMeta = {
    buy:      { name:'BuyHolding',      cls:'done',  dot:'✅', desc:'已实现 · 双写 from+holding' },
    sell:     { name:'SellHolding',     cls:'done',  dot:'✅', desc:'已实现 · 双写 from+holding' },
    dividend: { name:'RecordDividend',  cls:'proto', dot:'⏳', desc:'proto 有 · 双写待 income account' },
    split:    { name:'RecordSplit',     cls:'todo',  dot:'⏳', desc:'待实现 · 无现金流' },
  }[state.type];

  html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:14px">'
       +    '<span class="api-badge '+apiMeta.cls+'"><span class="dot"></span>'+apiMeta.name+' · '+apiMeta.dot+' '+apiMeta.desc+'</span>'
       + '</div>';

  html += '<div class="chosen-row"><span class="cr-label">类型</span><span class="cr-val" style="margin-left:auto">'+({buy:'买入',sell:'卖出',dividend:'分红',split:'拆分'}[state.type])+'</span></div>';
  html += '<div class="chosen-row"><span class="cr-label">证券</span><span class="cr-val" style="margin-left:auto">'+sec.symbol+' · '+sec.name+'</span></div>';

  if(state.type==='buy' || state.type==='sell'){
    var qty = parseFloat($('qty').value)||0, price = parseFloat($('price').value)||0, fee = parseFloat($('fee').value)||0;
    var amt = state.type==='buy' ? (qty*price+fee) : (qty*price-fee);
    var acct = window.ACCOUNTS[state.acctId];
    var bal = ACCT_BAL[state.acctId]||0;
    var after = state.type==='buy' ? (bal-amt) : (bal+amt);
    var fail = state.type==='buy' && after<0;
    html += '<div class="chosen-row"><span class="cr-label">账户</span><span class="cr-val" style="margin-left:auto">'+acct.name+' ('+acct.currency+')</span></div>';
    html += '<div class="chosen-row"><span class="cr-label">数量 × 价格</span><span class="cr-val" style="margin-left:auto">'+qty+' × '+fmt(price,secCur)+'</span></div>';
    html += '<div class="chosen-row"><span class="cr-label">费用</span><span class="cr-val" style="margin-left:auto">'+fmt(fee,secCur)+'</span></div>';
    html += '<div class="chosen-row" style="background:'+(fail?'var(--down-soft)':'var(--accent-soft)')+'"><span class="cr-label" style="color:'+(fail?'var(--down)':'var(--muted)')+'">金额</span><span class="cr-val" style="margin-left:auto;color:'+(fail?'var(--down)':'var(--fg-strong)')+'">'+fmt(amt,secCur)+'</span></div>';
    html += '<div class="chosen-row" style="background:'+(fail?'var(--down-soft)':'var(--up-soft)')+'">'
         +   '<span class="cr-label" style="color:'+(fail?'var(--down)':'var(--muted)')+'">账户余额</span>'
         +   '<span class="cr-val" style="margin-left:auto;color:'+(fail?'var(--down)':'var(--up)')+'">'+fmt(bal,secCur)+' → '+fmt(after,secCur)+'</span>'
         + '</div>';
    if(fail){
      html += '<div class="bal-preview fail" style="margin-top:10px">'
           +   '<span class="bp-warn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>余额不足 · fail-fast 拦截</span>'
           + '</div>';
    }
  } else if(state.type==='dividend'){
    var per = parseFloat($('perShare').value)||0;
    var h = window.HOLDINGS.find(function(x){return x.security_id===state.secId;});
    var qty = h?h.quantity:0; var amt = per*qty;
    var acct = window.ACCOUNTS[state.incomeAcctId];
    html += '<div class="chosen-row"><span class="cr-label">入账账户</span><span class="cr-val" style="margin-left:auto">'+acct.name+'</span></div>';
    html += '<div class="chosen-row"><span class="cr-label">每股股息</span><span class="cr-val" style="margin-left:auto">'+fmt(per,secCur)+'</span></div>';
    html += '<div class="chosen-row"><span class="cr-label">持有量</span><span class="cr-val" style="margin-left:auto">'+qty+' 股</span></div>';
    html += '<div class="chosen-row" style="background:var(--dividend-soft)"><span class="cr-label" style="color:var(--dividend)">分红总额</span><span class="cr-val" style="margin-left:auto;color:var(--dividend)">'+fmt(amt,secCur)+'</span></div>';
  } else { // split
    var h = window.HOLDINGS.find(function(x){return x.security_id===state.secId;});
    var qty = h?h.quantity:0, cost = h?h.cost_price:0;
    var mult = state.splitRatioFrom>0 ? state.splitRatioTo/state.splitRatioFrom : 1;
    html += '<div class="chosen-row"><span class="cr-label">拆分比例</span><span class="cr-val" style="margin-left:auto">'+state.splitRatioFrom+' : '+state.splitRatioTo+'</span></div>';
    html += '<div class="chosen-row"><span class="cr-label">持有量</span><span class="cr-val" style="margin-left:auto;color:var(--muted);text-decoration:line-through">'+qty+' 股</span></div>';
    html += '<div class="chosen-row" style="background:var(--split-soft)"><span class="cr-label" style="color:var(--split)">拆分后</span><span class="cr-val" style="margin-left:auto;color:var(--split)">'+(qty*mult)+' 股 @ '+fmt(cost/mult,secCur)+'</span></div>';
    html += '<div class="split-noop" style="margin-top:10px"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>无现金流 · 仅调整 quantity 与 cost_price</div>';
  }

  $('confirmBox').innerHTML = html;
}

function doSubmit(){
  alert('[mock] 提交 ' + state.type + ' · 实际调用对应 API（见顶部注释）');
}

/* init */
renderSecDisplay(state.secId);
renderStep();
</script>
</body>
</html>
