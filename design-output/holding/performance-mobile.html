<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=410, initial-scale=1">
<title>御财 · 收益统计 — Mobile</title>

<!-- ======================================================================
     收益统计页 · Mobile（<768px · 390×844 · 纵向 6 组件）
     ------------------------------------------------------------------------
     spec §5 收益统计页(独立):mobile 纵向布局
       ① 概览头  ② 总收益曲线(日/月/年+区间)  ③ realized/unrealized
       ④ 年化+基准  ⑤ 持仓贡献  ⑥ 类型贡献
     复用: styles.css + mock-data.js(无 Task 6 mock 改动)
     API 标注: ⏳ C snapshot；曲线首批前端从 TRADES/PRICE_HISTORY 聚合 mock
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="d-mobile">

<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="11" width="3" height="9" rx="1"/><rect x="11" y="7" width="3" height="13" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="26" height="14"><rect x="2" y="4" width="18" height="16" rx="3"/><rect x="4.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 9v6" stroke-width="2"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="tb-title">
      <h1>收益统计</h1>
      <span class="tb-sub">总收益 · 分解 · 年化 · 贡献</span>
    </div>
    <div class="tb-actions">
      <span class="icon-btn" id="refreshBtn"></span>
    </div>
  </header>

  <!-- 滚动区 -->
  <div class="scroll" id="scroll">

    <!-- ① 概览头 -->
    <section class="m-sec">
      <div class="perf-header m-perf-header" id="perfHeader"></div>
    </section>

    <!-- ② 总收益曲线 -->
    <section class="m-sec">
      <div class="curve-card perf-curve m-curve-card-perf" id="curveCard"></div>
    </section>

    <!-- ③ realized/unrealized -->
    <section class="m-sec">
      <div class="split-card m-split-card" id="splitCard"></div>
    </section>

    <!-- ④ 年化收益率 -->
    <section class="m-sec">
      <div class="annual-card m-annual-card" id="annualCard"></div>
    </section>

    <!-- ⑤ 持仓贡献 -->
    <section class="m-sec">
      <div class="contrib-card m-contrib-card" id="contribHoldingCard"></div>
    </section>

    <!-- ⑥ 类型贡献 -->
    <section class="m-sec">
      <div class="contrib-card m-contrib-card" id="contribTypeCard"></div>
    </section>

    <!-- API 标注 -->
    <div class="api-note">
      <span class="icon" id="apiNoteIcon"></span>
      <span class="an-badge">⏳ C</span>
      <span>收益 snapshot（日/月/年）C 子项目实现；本页 mock 前端聚合。</span>
    </div>

    <div style="height:8px;"></div>
  </div>

  <!-- 底部 tabbar -->
  <nav class="tabbar">
    <div class="tab"><span data-icon="briefcase"></span>持仓</div>
    <div class="tab active"><span data-icon="trending-up"></span>收益</div>
    <div class="tab"><span data-icon="plus"></span>交易</div>
    <div class="tab"><span data-icon="pie-chart"></span>资产</div>
    <div class="tab"><span data-icon="user"></span>我的</div>
  </nav>

</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;
  var fmtCNY = window.fmtCNY;
  var fmtPct = window.fmtPct;
  var fmtSigned = window.fmtSigned;

  document.getElementById('refreshBtn').innerHTML = icon('refresh-cw');
  document.getElementById('apiNoteIcon').innerHTML = icon('info');
  document.getElementById('refreshBtn').addEventListener('click', function () {
    this.classList.add('spinning');
    var self = this; setTimeout(function () { self.classList.remove('spinning'); }, 1000);
  });
  /* tabbar icons */
  document.querySelectorAll('.tabbar .tab span[data-icon]').forEach(function (s) {
    s.innerHTML = icon(s.dataset.icon);
  });

  function aggregatePnl() {
    var realized = 0, unrealized = 0;
    window.HOLDINGS.forEach(function (h) {
      var br = window.holdingPnlBreakdown(h.id);
      realized   += window.toCNY(br.realized,   h.currency);
      unrealized += window.toCNY(br.unrealized, h.currency);
    });
    var total = realized + unrealized;
    return {
      realized: realized, unrealized: unrealized, total: total,
      realizedPct: total !== 0 ? (realized / total) * 100 : 0,
      unrealizedPct: total !== 0 ? (unrealized / total) * 100 : 0,
    };
  }

  /* ① 概览头 */
  var agg = aggregatePnl();
  var sum = window.computeSummary();
  var totalUp = agg.total >= 0;
  var absTotal = Math.abs(agg.total);
  document.getElementById('perfHeader').innerHTML =
      '<div class="ph-left">'
    +   '<span class="ph-label">' + icon('trending-up') + '总收益（CNY）</span>'
    +   '<span class="ph-value ' + (totalUp ? 'up' : 'down') + '">' + (totalUp ? '+' : '-') + fmtCNY(absTotal) + '</span>'
    +   '<span class="ph-sub">成本 ' + fmtCNY(sum.totalCostCNY) + ' <span class="ph-sep">·</span> 市值 ' + fmtCNY(sum.totalMktCNY) + '</span>'
    + '</div>'
    + '<div class="ph-right">'
    +   '<span class="ph-pill ' + (totalUp ? 'up' : 'down') + '">' + icon(totalUp ? 'trending-up' : 'trending-down') + fmtPct(sum.totalPnlPct) + '</span>'
    + '</div>';

  /* ② 总收益曲线 */
  function buildTotalCurve(range) {
    var seriesBySec = window.HOLDINGS.map(function (h) {
      var sec = window.SECURITIES[h.security_id];
      return { h: h, sec: sec, pts: (window.PRICE_HISTORY[sec.id] || {})[range] || [] };
    });
    var maxLen = 0; seriesBySec.forEach(function (s) { if (s.pts.length > maxLen) maxLen = s.pts.length; });
    var total = [];
    for (var i = 0; i < maxLen; i++) {
      var sumV = 0, label = '', any = false;
      seriesBySec.forEach(function (s) {
        if (s.pts[i]) { sumV += window.toCNY(s.pts[i].v * s.h.quantity, s.h.currency); label = s.pts[i].t; any = true; }
      });
      if (any) total.push({ t: label, v: sumV });
    }
    return total;
  }
  function applyRangeFilter(pts, rangeSec) {
    if (!rangeSec || rangeSec === 'ALL' || !pts.length || pts.length <= 12) return pts;
    var n = pts.length, take;
    if (rangeSec === '1M') take = Math.min(n, Math.round(n / 12) || 1);
    else if (rangeSec === '3M') take = Math.min(n, Math.round(n / 4) || 1);
    else if (rangeSec === '6M') take = Math.min(n, Math.round(n / 2) || 1);
    else if (rangeSec === '1Y') take = Math.min(n, Math.round(n * 0.8) || 1);
    else take = n;
    return pts.slice(n - take);
  }
  function renderCurve(range, rangeSec) {
    range = range || 'D'; rangeSec = rangeSec || 'ALL';
    var pts = applyRangeFilter(buildTotalCurve(range), rangeSec);
    var curve = window.buildCurve(pts);
    var stroke = curve.up ? 'var(--up)' : 'var(--down)';
    var fill   = curve.up ? 'var(--up-soft)' : 'var(--down-soft)';
    var rangeLabel = range === 'D' ? '近 30 天' : range === 'M' ? '近 12 月' : '近 5 年';
    var firstLabel = pts.length ? pts[0].t : '—';
    var lastLabel  = pts.length ? pts[pts.length - 1].t : '—';
    var delta = pts.length >= 2 ? pts[pts.length - 1].v - pts[0].v : 0;
    var deltaPct = pts.length >= 2 && pts[0].v ? (delta / pts[0].v) * 100 : 0;

    var head =
        '<div class="curve-head perf-head" style="flex-direction:column;align-items:stretch;gap:10px;">'
      +   '<div class="ch-title"><h3>总收益曲线</h3><span class="ch-sub">' + rangeLabel + ' · ' + fmtPct(deltaPct) + '</span></div>'
      +   '<div class="range-row">'
      +     '<div class="range-tabs" id="rangeTabs">'
      +       '<button class="range-tab ' + (range === 'D' ? 'active' : '') + '" data-r="D">日</button>'
      +       '<button class="range-tab ' + (range === 'M' ? 'active' : '') + '" data-r="M">月</button>'
      +       '<button class="range-tab ' + (range === 'Y' ? 'active' : '') + '" data-r="Y">年</button>'
      +     '</div>'
      +     '<div class="range-secondary" id="rangeSec">'
      +       '<button class="range-sec-btn ' + (rangeSec === '1M'  ? 'active' : '') + '" data-s="1M">1M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '3M'  ? 'active' : '') + '" data-s="3M">3M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '6M'  ? 'active' : '') + '" data-s="6M">6M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '1Y'  ? 'active' : '') + '" data-s="1Y">1Y</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === 'ALL' ? 'active' : '') + '" data-s="ALL">全部</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';

    var body = pts.length === 0
      ? '<div class="trades-empty" style="padding:24px 16px;"><div class="te-icon">' + icon('trending-up') + '</div><div class="te-title">暂无行情</div></div>'
      : '<div class="curve-body">'
        + '<svg class="curve-chart" viewBox="0 0 100 40" preserveAspectRatio="none">'
        +   '<defs><linearGradient id="cgPerfM" x1="0" y1="0" x2="0" y2="1">'
        +     '<stop offset="0%" stop-color="' + fill + '" stop-opacity="0.7"/>'
        +     '<stop offset="100%" stop-color="' + fill + '" stop-opacity="0.1"/>'
        +   '</linearGradient></defs>'
        +   '<path d="' + curve.area + '" fill="url(#cgPerfM)" stroke="none"/>'
        +   '<path d="' + curve.line + '" fill="none" stroke="' + stroke + '" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
        + '</svg>'
        + '<div class="curve-axis"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>'
        + '</div>';

    var foot =
        '<div class="curve-foot">'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:var(--gold)"></span>起点</span><span class="cf-v mono">' + (pts.length ? fmtCNY(pts[0].v) : '—') + '</span></div>'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:' + stroke + '"></span>终点</span><span class="cf-v mono ' + (curve.up ? 'up' : 'down') + '">' + (pts.length ? fmtCNY(pts[pts.length - 1].v) : '—') + '</span></div>'
        + '</div>';

    document.getElementById('curveCard').innerHTML = head + body + foot;
    document.querySelectorAll('#rangeTabs .range-tab').forEach(function (b) {
      b.addEventListener('click', function () { renderCurve(b.dataset.r, rangeSec); });
    });
    document.querySelectorAll('#rangeSec .range-sec-btn').forEach(function (b) {
      b.addEventListener('click', function () { renderCurve(range, b.dataset.s); });
    });
  }
  renderCurve('D', 'ALL');

  /* ③ realized/unrealized */
  var unreaPos = agg.unrealized >= 0;
  document.getElementById('splitCard').innerHTML =
      '<div class="split-head"><div class="sh-title"><h3>收益分解</h3><span class="ch-sub">已实现 + 未实现</span></div><span class="api-badge proto"><span class="dot"></span>⏳ C</span></div>'
    + '<div class="split-body">'
    +   '<div class="split-bar">'
    +     '<div class="sb-realized" style="width:' + Math.max(0, agg.realizedPct) + '%"></div>'
    +     '<div class="sb-unrealized ' + (unreaPos ? '' : 'down') + '" style="width:' + Math.max(0, agg.unrealizedPct) + '%"></div>'
    +   '</div>'
    +   '<div class="split-legend">'
    +     '<div class="sl-cell"><span class="sl-k"><span class="swatch" style="background:var(--gold)"></span>已实现</span><span class="sl-v gold">' + fmtCNY(agg.realized) + '</span><span class="sl-pct">' + agg.realizedPct.toFixed(1) + '%</span></div>'
    +     '<div class="sl-cell"><span class="sl-k"><span class="swatch" style="background:' + (unreaPos ? 'var(--up)' : 'var(--down)') + '"></span>未实现</span><span class="sl-v ' + (unreaPos ? 'up' : 'down') + '">' + fmtCNY(agg.unrealized) + '</span><span class="sl-pct">' + agg.unrealizedPct.toFixed(1) + '%</span></div>'
    +   '</div>'
    + '</div>';

  /* ④ 年化收益率 */
  var myAnnualized = 12.4, myCumulative = sum.totalPnlPct;
  var benchAnnualized = 5.4, benchDelta = myAnnualized - benchAnnualized;
  document.getElementById('annualCard').innerHTML =
      '<div class="annual-head"><div class="ah-title"><h3>年化收益率</h3><span class="ah-sub">基准 沪深300 · mock</span></div></div>'
    + '<div class="annual-body">'
    +   '<div class="annual-row"><span class="ar-label">' + icon('percent') + '年化</span><span class="ar-val up">' + fmtPct(myAnnualized) + '</span></div>'
    +   '<div class="annual-row"><span class="ar-label">' + icon('trending-up') + '累计</span><span class="ar-val ' + (myCumulative >= 0 ? 'up' : 'down') + '">' + fmtPct(myCumulative) + '</span></div>'
    +   '<div class="bench-mini">'
    +     '<div class="bm-row"><span class="bm-label">我</span><div class="bm-track"><div class="bm-fill my pos" style="width:' + Math.min(50, Math.abs(myAnnualized)) + '%"></div><div class="bm-mid"></div></div><span class="bm-val up">' + fmtPct(myAnnualized) + '</span></div>'
    +     '<div class="bm-row"><span class="bm-label">沪深300</span><div class="bm-track"><div class="bm-fill bench" style="width:' + Math.min(50, Math.abs(benchAnnualized)) + '%"></div><div class="bm-mid"></div></div><span class="bm-val up">' + fmtPct(benchAnnualized) + '</span></div>'
    +     '<div class="bm-row" style="margin-top:2px;font-size:11px;color:var(--muted);"><span class="bm-label">超额</span><div class="bm-track" style="background:transparent;border:none;"></div><span class="bm-val ' + (benchDelta >= 0 ? 'up' : 'down') + '">' + fmtPct(benchDelta) + '</span></div>'
    +   '</div>'
    + '</div>';

  /* ⑤ 持仓贡献 */
  function contribScale(rows) { var m = 0; rows.forEach(function (r) { if (Math.abs(r.value) > m) m = Math.abs(r.value); }); return m || 1; }
  var holdRows = window.HOLDINGS.map(function (h) {
    var sec = window.SECURITIES[h.security_id];
    var br = window.holdingPnlBreakdown(h.id);
    return { sym: sec.symbol, type: sec.type, value: window.toCNY(br.totalPnl, h.currency) };
  }).sort(function (a, b) { return b.value - a.value; });
  var hscale = contribScale(holdRows);
  document.getElementById('contribHoldingCard').innerHTML =
      '<div class="contrib-head"><div class="ch-title"><h3>持仓贡献</h3><span class="ch-sub">正绿负红</span></div></div>'
    + '<div class="contrib-body">' + holdRows.map(function (r) {
        var meta = window.TYPE_META[r.type]; var pct = (Math.abs(r.value) / hscale) * 50;
        return '<div class="contrib-row"><span class="cr-name"><span class="swatch" style="background:' + meta.color + '"></span><span class="cr-sym">' + r.sym + '</span></span><div class="contrib-track"><div class="ct-mid"></div><div class="ct-fill ' + (r.value >= 0 ? 'pos' : 'neg') + '" style="width:' + pct + '%"></div></div><span class="contrib-val ' + (r.value >= 0 ? 'up' : 'down') + '">' + fmtSigned(r.value, 'CNY') + '</span></div>';
      }).join('') + '</div>';

  /* ⑥ 类型贡献 */
  var byType = {};
  window.HOLDINGS.forEach(function (h) {
    var sec = window.SECURITIES[h.security_id];
    var br = window.holdingPnlBreakdown(h.id);
    byType[sec.type] = (byType[sec.type] || 0) + window.toCNY(br.totalPnl, h.currency);
  });
  var typeRows = Object.keys(window.TYPE_META).map(function (t) { return { type: t, value: byType[t] || 0 }; }).filter(function (r) { return r.value !== 0; }).sort(function (a, b) { return b.value - a.value; });
  var tscale = contribScale(typeRows);
  document.getElementById('contribTypeCard').innerHTML =
      '<div class="contrib-head"><div class="ch-title"><h3>类型贡献</h3><span class="ch-sub">按 type 聚合</span></div></div>'
    + '<div class="contrib-body">' + (typeRows.length === 0 ? '<div class="contrib-empty">' + icon('pie-chart') + '<div style="margin-top:6px;">暂无盈亏</div></div>' : typeRows.map(function (r) {
        var meta = window.TYPE_META[r.type]; var pct = (Math.abs(r.value) / tscale) * 50;
        return '<div class="contrib-row"><span class="cr-name"><span class="swatch" style="background:' + meta.color + '"></span><span class="cr-sym">' + meta.label + '</span></span><div class="contrib-track"><div class="ct-mid"></div><div class="ct-fill ' + (r.value >= 0 ? 'pos' : 'neg') + '" style="width:' + pct + '%"></div></div><span class="contrib-val ' + (r.value >= 0 ? 'up' : 'down') + '">' + fmtSigned(r.value, 'CNY') + '</span></div>';
      }).join('')) + '</div>';
})();
</script>
</body>
</html>
