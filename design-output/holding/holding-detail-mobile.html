<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=410, initial-scale=1">
<title>御财 · 持仓详情 — Mobile</title>

<!-- ======================================================================
     持仓详情 · Mobile（<768px · 390×844 · 纵向 + 曲线折叠）
     ------------------------------------------------------------------------
     目标持仓: h1 (AAPL · stock · USD)
     API 标注（对照 spec §4）:
       · ListHoldings(security_id filter)                ✅ 已实现
       · ListHoldingTransactions(holding_id)             ⏳ 待实现
       · 收益 snapshot(日/月/年)                          ⏳ C 子项目
       · goal.backing_holding_id                         ⏳ D 子项目
         → 关联目标卡(市值 vs 目标额) · 对接真 window.GOALS(window.goalView)
     操作: buy/sell/dividend/split 触发统一 step wizard(见 trade-sheet-mobile.html)
     数据源: window.HOLDINGS / window.TRADES / window.PRICE_HISTORY
     ====================================================================== -->
<link rel="stylesheet" href="styles.css">
<style>
  /* —— 关联目标卡 状态化增强（对接真 GOALS · 同 desktop/tablet）—— */
  .goal-card .gc-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .goal-card .gc-name-row .gc-name { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--fg-strong); }
  .goal-card .gc-name-row .gc-name .icon { width: 13px; height: 13px; color: var(--gold); }
  .goal-card .goal-progress .gp-fill.over { background: var(--up); }
  .goal-card .goal-progress .gp-fill.ontrack { background: var(--gold); }
  .goal-card .goal-progress .gp-fill.behind { background: var(--down); }
  .goal-card .gc-pct.over { color: var(--up); }
  .goal-card .gc-pct.behind { color: var(--down); }
  .goal-card .gc-link-cta { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 11.5px; color: var(--gold-deep); text-decoration: none; }
  .goal-card .gc-link-cta .icon { width: 12px; height: 12px; }
  .goal-card .gc-link-cta:hover { text-decoration: underline; }
  .goal-card .gc-empty .gce-title { font-size: 13px; color: var(--fg); font-weight: 500; margin-top: 4px; }
  .goal-card .gc-empty .gce-text { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .goal-card .gc-empty .gc-empty-cta { margin-top: 12px; padding: 6px 12px; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .goal-card .gc-empty .gc-empty-cta .icon { width: 12px; height: 12px; color: #fff; margin: 0; }
</style>
</head>
<body class="d-mobile">

<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="11" width="3" height="9" rx="1"/><rect x="11" y="7" width="3" height="13" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="26" height="14"><rect x="2" y="4" width="18" height="16" rx="3"/><rect x="4.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 9v6" stroke-width="2"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="tb-title">
      <h1 id="pageTitle">持仓详情</h1>
      <span class="tb-sub" id="pageSub">AAPL</span>
    </div>
    <div class="tb-actions">
      <span class="icon-btn" id="moreBtn"></span>
    </div>
  </header>

  <!-- 滚动区 -->
  <div class="scroll" id="scroll">

    <!-- 返回 -->
    <div class="m-detail-back" onclick="history.back()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      返回
    </div>

    <!-- ① 头部 -->
    <section class="m-sec">
      <div class="detail-header" id="detailHeader"></div>
    </section>

    <!-- ② 持仓卡 -->
    <section class="m-sec">
      <div class="position-card m-position-card" id="positionCard"></div>
    </section>

    <!-- ③ 收益曲线（可折叠） -->
    <section class="m-sec">
      <div class="m-curve-toggle" id="curveToggle">
        <span class="mct-left">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <h3>收益曲线</h3>
        </span>
        <span class="mct-chev" id="mctChev">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </div>
      <div class="m-curve-wrap" id="curveWrap">
        <div class="curve-card m-curve-card" id="curveCard"></div>
      </div>
    </section>

    <!-- ⑤ 配置占比 + ⑥ 关联目标（纵向） -->
    <section class="m-sec">
      <div class="alloc-mini" id="allocMini"></div>
    </section>
    <section class="m-sec">
      <div class="goal-card" id="goalCard"></div>
    </section>

    <!-- ④ 交易历史 -->
    <section class="m-sec">
      <div class="trades-card m-trades-card" id="tradesCard"></div>
    </section>

    <!-- 占位（操作 bar sticky 底部） -->
    <div style="height:8px;"></div>

  </div>

  <!-- ⑦ 操作 bar（sticky 底部） -->
  <div class="m-action-bar">
    <div class="action-bar" id="actionBar"></div>
  </div>

</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var HOLDING_ID = 'h1';
  var sec    = window.SECURITIES[window.HOLDINGS.find(function (h) { return h.id === HOLDING_ID; }).security_id];
  var h      = window.HOLDINGS.find(function (x) { return x.id === HOLDING_ID; });
  var v      = window.holdingView(h);
  var icon   = window.icon;
  var TYPE   = { stock: 't-stock', fund: 't-fund', etf: 't-etf', bond: 't-bond', gold: 't-gold' };
  var up     = v.up;
  var cur    = h.currency;
  var fmtRaw = window.fmtRaw;
  var fmtPct = window.fmtPct;
  var fmtSigned = window.fmtSigned;

  document.getElementById('moreBtn').innerHTML = icon('plus');
  document.getElementById('pageTitle').textContent = sec.symbol;
  document.getElementById('pageSub').textContent = sec.name + ' · ' + window.TYPE_META[sec.type].label;

  /* —— ① 头部 —— */
  document.getElementById('detailHeader').innerHTML =
      '<div class="dh-left">'
    +   '<div class="dh-symbol-row">'
    +     '<span class="dh-symbol" style="font-size:24px;">' + sec.symbol + '</span>'
    +     '<span class="type-chip ' + TYPE[sec.type] + '"><span class="tc-dot"></span>' + window.TYPE_META[sec.type].label + '</span>'
    +   '</div>'
    +   '<div class="dh-name">' + sec.name + '</div>'
    +   '<div class="dh-meta">'
    +     '<span class="dh-meta-item">' + icon('banknote') + sec.market + '</span>'
    +     '<span class="dh-meta-item">' + icon('coins') + '<span class="dh-cur">' + sec.currency + '</span></span>'
    +   '</div>'
    + '</div>'
    + '<div class="dh-right">'
    +   '<div class="dh-price-row">'
    +     '<span class="dh-price mono" style="font-size:22px;" id="dhPrice">' + fmtRaw(h.current_price, cur) + '</span>'
    +     '<button class="dh-refresh" id="dhRefresh" title="刷新现价">' + icon('refresh-cw') + '</button>'
    +   '</div>'
    +   '<div class="dh-updated" id="dhUpdated">更新于 06-29 15:00</div>'
    + '</div>';

  /* —— ② 持仓卡 —— */
  document.getElementById('positionCard').innerHTML =
      '<div class="pc-top">'
    +   '<div class="pc-mkt">'
    +     '<span class="pc-label">当前市值</span>'
    +     '<span class="pc-mktval mono">' + fmtRaw(v.mktVal, cur) + '<span class="cc">' + cur + '</span></span>'
    +   '</div>'
    +   '<span class="pc-pnl-pill ' + (up ? 'up' : 'down') + '">'
    +     icon(up ? 'trending-up' : 'trending-down')
    +     fmtPct(v.pnlPct)
    +   '</span>'
    + '</div>'
    + '<div class="pc-grid">'
    +   '<div class="pc-cell"><span class="pc-k">持有量</span><span class="pc-v mono">' + h.quantity + '</span></div>'
    +   '<div class="pc-cell"><span class="pc-k">成本价</span><span class="pc-v mono">' + fmtRaw(h.cost_price, cur) + '</span></div>'
    +   '<div class="pc-cell"><span class="pc-k">现价</span><span class="pc-v mono">' + fmtRaw(h.current_price, cur) + '</span></div>'
    +   '<div class="pc-cell"><span class="pc-k">总成本</span><span class="pc-v mono">' + fmtRaw(v.cost, cur) + '</span></div>'
    + '</div>';

  /* —— ③ 收益曲线 —— */
  function renderCurve(range) {
    range = range || 'D';
    var pts = (window.PRICE_HISTORY[sec.id] || {})[range] || [];
    var curve = window.buildCurve(pts);
    var br = window.holdingPnlBreakdown(HOLDING_ID);
    var stroke = curve.up ? 'var(--up)' : 'var(--down)';
    var fill   = curve.up ? 'var(--up-soft)' : 'var(--down-soft)';
    var firstLabel = pts.length ? pts[0].t : '—';
    var lastLabel  = pts.length ? pts[pts.length - 1].t : '—';

    var head =
        '<div class="curve-head">'
      +   '<div class="ch-title"><span class="ch-sub">' + (range === 'D' ? '近 30 天' : range === 'M' ? '近 12 月' : '近 5 年') + '</span></div>'
      +   '<div class="range-tabs" id="rangeTabs">'
      +     '<button class="range-tab ' + (range === 'D' ? 'active' : '') + '" data-r="D">日</button>'
      +     '<button class="range-tab ' + (range === 'M' ? 'active' : '') + '" data-r="M">月</button>'
      +     '<button class="range-tab ' + (range === 'Y' ? 'active' : '') + '" data-r="Y">年</button>'
      +   '</div>'
      + '</div>';

    var body = pts.length === 0
      ? '<div class="trades-empty"><div class="te-icon">' + icon('trending-up') + '</div><div class="te-title">暂无行情数据</div></div>'
      : '<div class="curve-body">'
        + '<svg class="curve-chart" viewBox="0 0 100 40" preserveAspectRatio="none">'
        +   '<path d="' + curve.area + '" fill="' + fill + '" fill-opacity="0.55" stroke="none"/>'
        +   '<path d="' + curve.line + '" fill="none" stroke="' + stroke + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
        + '</svg>'
        + '<div class="curve-axis"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>'
        + '</div>';

    var foot =
        '<div class="curve-foot">'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:var(--up)"></span>浮动</span><span class="cf-v mono ' + (br.unrealized >= 0 ? 'up' : 'down') + '">' + fmtSigned(br.unrealized, cur) + '</span></div>'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:var(--gold)"></span>已实现</span><span class="cf-v mono">' + fmtRaw(br.realized, cur) + '</span></div>'
        + '</div>';

    document.getElementById('curveCard').innerHTML = head + body + foot;
    document.querySelectorAll('#rangeTabs .range-tab').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); renderCurve(b.dataset.r); });
    });
  }
  renderCurve('D');

  /* —— 曲线折叠 —— */
  var curveToggle = document.getElementById('curveToggle');
  var curveWrap   = document.getElementById('curveWrap');
  curveToggle.addEventListener('click', function () {
    curveToggle.classList.toggle('collapsed');
    curveWrap.classList.toggle('collapsed');
  });

  /* —— ⑤ 配置占比 —— */
  var pct = window.holdingAllocationPct(HOLDING_ID);
  var alloc = window.computeAllocation();
  var rankIdx = alloc.findIndex(function (a) { return a.type === sec.type; });
  var donut = window.holdingDonut(HOLDING_ID);
  document.getElementById('allocMini').innerHTML =
      '<div class="am-donut" style="background:' + donut + '">'
    +   '<div class="am-hole"><span class="am-pct mono">' + pct.toFixed(1) + '%</span><span class="am-label">占比</span></div>'
    + '</div>'
    + '<div class="am-body">'
    +   '<h3>配置占比</h3>'
    +   '<span class="am-sub">' + pct.toFixed(2) + '% · ' + window.TYPE_META[sec.type].label + ' #' + (rankIdx + 1) + '</span>'
    + '</div>';

  /* —— ⑥ 关联目标（对接真 GOALS · spec §4.6 / §6）—— */
  var STATUS_META = {
    over:    { label: '超目标', icon: 'check-circle' },
    ontrack: { label: '进行中', icon: 'trending-up' },
    behind:  { label: '落后',   icon: 'alert-triangle' },
  };
  var linkedGoal = window.GOALS.find(function (g) { return g.backing_holding_id === HOLDING_ID; });
  var gv = linkedGoal ? window.goalView(linkedGoal.id) : null;
  var goalHtml;
  if (linkedGoal && gv) {
    var pctClamped = Math.min(100, gv.pct);
    var sMeta = STATUS_META[gv.status];
    goalHtml =
        '<div class="gc-head"><div class="gc-title">' + icon('gem', 'icon') + '<h3>关联目标</h3></div><span class="gc-badge">⏳ D</span></div>'
      + '<div class="gc-body">'
      +   '<div class="gc-name-row"><span class="gc-name">' + icon('target') + linkedGoal.name + '</span>'
      +     '<span class="status-pill ' + gv.status + '">' + icon(sMeta.icon) + sMeta.label + '</span></div>'
      +   '<div class="goal-progress"><div class="gp-fill ' + gv.status + '" style="width:' + pctClamped + '%"></div></div>'
      +   '<div class="gc-nums"><span class="gc-cur">' + window.fmtCNY(linkedGoal.current_market_value_cents / 100) + '</span><span class="gc-sep">/</span><span class="gc-target">' + window.fmtCNY(linkedGoal.target_cents / 100) + '</span></div>'
      +   '<div class="gc-foot"><span class="gc-pct ' + gv.status + '">' + gv.pct.toFixed(1) + '%</span><span class="gc-eta">' + icon('calendar') + '预计 ' + gv.eta + '</span></div>'
      +   '<a class="gc-link-cta" href="goal-link-mobile.html">' + icon('link') + '查看投资目标页</a>'
      + '</div>';
  } else {
    goalHtml =
        '<div class="gc-head"><div class="gc-title">' + icon('gem', 'icon') + '<h3>关联目标</h3></div><span class="gc-badge">⏳ D</span></div>'
      + '<div class="gc-empty">' + icon('gem')
      +   '<div class="gce-title">该持仓未关联投资目标</div>'
      +   '<div class="gce-text">前往投资目标页，将此持仓设为目标 backing</div>'
      +   '<a class="btn btn-gold gc-empty-cta" href="goal-link-mobile.html">' + icon('plus') + '去关联目标</a>'
      + '</div>';
  }
  document.getElementById('goalCard').innerHTML = goalHtml;

  /* —— ⑦ 操作 bar（sticky 底部） —— */
  document.getElementById('actionBar').innerHTML =
      '<button class="act-btn t-buy" data-act="buy"><span class="ab-icon">' + icon('arrow-down-circle') + '</span><span class="ab-name">买入</span></button>'
    + '<button class="act-btn t-sell" data-act="sell"><span class="ab-icon">' + icon('arrow-up-circle') + '</span><span class="ab-name">卖出</span></button>'
    + '<button class="act-btn t-dividend" data-act="dividend"><span class="ab-icon">' + icon('coins') + '</span><span class="ab-name">分红</span></button>'
    + '<button class="act-btn t-split" data-act="split"><span class="ab-icon">' + icon('git-merge') + '</span><span class="ab-name">拆分</span></button>';
  document.querySelectorAll('#actionBar .act-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var toast = document.createElement('div');
      toast.className = 'toast ok';
      toast.innerHTML = window.icon('check') + '触发 ' + b.dataset.act + ' 向导';
      toast.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:100;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9999px;background:#1c1e21;color:#fff;font-size:12px;box-shadow:0 12px 32px rgba(40,35,25,.18);';
      document.body.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 1800);
    });
  });

  /* —— ④ 交易历史（mobile 紧凑，隐藏备注列） —— */
  function renderTrades(filter) {
    filter = filter || 'all';
    var all = window.holdingTrades(HOLDING_ID);
    var rows = filter === 'all' ? all : all.filter(function (t) { return t.type === filter; });
    var typeMeta = {
      buy:      { cls: 't-buy',      label: '买',   icon: 'arrow-down-circle' },
      sell:     { cls: 't-sell',     label: '卖',   icon: 'arrow-up-circle' },
      dividend: { cls: 't-dividend', label: '息',   icon: 'coins' },
      split:    { cls: 't-split',    label: '拆',   icon: 'git-merge' },
    };
    var body = rows.length === 0
      ? '<div class="trades-empty"><div class="te-icon">' + icon('calendar') + '</div><div class="te-title">暂无成交</div></div>'
      : '<table class="trades-table">'
        + '<thead><tr><th>日期</th><th>类型</th><th class="num">数量</th><th class="num">金额</th><th class="num hide-mobile">余量</th></tr></thead><tbody>'
        + rows.map(function (t) {
            var m = typeMeta[t.type];
            var flowCls = t.amount > 0 ? 'up' : t.amount < 0 ? 'down' : 'neutral';
            var amtTxt = t.amount === 0 ? '—' : fmtSigned(t.amount, cur);
            return '<tr>'
              + '<td class="td-date">' + t.date.slice(5) + '</td>'
              + '<td><span class="trade-tag ' + m.cls + '">' + icon(m.icon) + m.label + '</span></td>'
              + '<td class="num td-sym">' + (t.quantity > 0 ? '+' : '') + t.quantity + '</td>'
              + '<td class="num td-flow ' + flowCls + '">' + amtTxt + '</td>'
              + '<td class="num td-sym hide-mobile">' + t.balance_after + '</td>'
              + '</tr>';
          }).join('')
        + '</tbody></table>';

    var filters = [{ k: 'all', label: '全部' },{ k: 'buy', label: '买入' },{ k: 'sell', label: '卖出' },{ k: 'dividend', label: '分红' },{ k: 'split', label: '拆分' }];
    var chipsHtml = '<div class="chips scroll-x" id="tradeFilters" style="padding:0 14px 10px;">'
      + filters.map(function (f) {
          var cnt = f.k === 'all' ? all.length : all.filter(function (t) { return t.type === f.k; }).length;
          return '<span class="chip ' + (filter === f.k ? 'active' : '') + '" data-f="' + f.k + '">' + f.label + '<span class="cnt">' + cnt + '</span></span>';
        }).join('')
      + '</div>';

    var head = '<div class="trades-head"><div class="th-title"><h3>交易历史</h3><span class="th-sub">' + all.length + ' 条 · ⏳</span></div></div>';

    document.getElementById('tradesCard').innerHTML = head + chipsHtml + body;
    document.querySelectorAll('#tradeFilters .chip').forEach(function (c) {
      c.addEventListener('click', function () { renderTrades(c.dataset.f); });
    });
  }
  renderTrades('all');

  /* —— 头部刷新 —— */
  var refreshBtn = document.getElementById('dhRefresh');
  var updatedEl  = document.getElementById('dhUpdated');
  var priceEl    = document.getElementById('dhPrice');
  refreshBtn.addEventListener('click', function () {
    refreshBtn.classList.add('spinning');
    updatedEl.classList.add('loading');
    updatedEl.textContent = '刷新中…';
    setTimeout(function () {
      refreshBtn.classList.remove('spinning');
      updatedEl.classList.remove('loading');
      var now = new Date();
      var ts = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      updatedEl.textContent = '更新于 ' + ts;
      h.current_price = +(h.current_price * 1.002).toFixed(2);
      priceEl.textContent = fmtRaw(h.current_price, cur);
    }, 900);
  });
})();
</script>
</body>
</html>
