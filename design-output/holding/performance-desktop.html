<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>收益统计 · Desktop · 御财持仓</title>
<!--
  ============================================================================
  收益统计页 · Desktop（≥1024px · 1440×900 · 侧栏 + 主区 6 组件）
  ----------------------------------------------------------------------------
  spec §5 收益统计页(独立,C UI 原型):
    ① 概览头  总收益(CNY 折算) + 收益率 pill + 区间汇总
    ② 总收益曲线  日/月/年切换 + 区间(1M/3M/6M/1Y/全部) 二级筛选 · 折线 mock
    ③ realized/unrealized 分解  已实现(卖出+分红) + 未实现(浮动) + 占比条
    ④ 年化收益率 + 基准对比  年化/累计收益率 + 沪深300 基准 mock 对比
    ⑤ 按持仓贡献条  每持仓盈亏横向贡献条(正绿负红 · 中线对齐)
    ⑥ 按类型贡献条  按 type 聚合(stock/fund/etf/bond/gold) 贡献条

  API 标注(spec §5):
    - 收益 snapshot 表(日/月/年聚合)                            ⏳ C 子项目
        → 本页所有曲线/数字 mock(前端从 PRICE_HISTORY + TRADES 聚合)
    - 曲线首批前端从 ListHoldingTransactions/TRADES 聚合         ✅ mock 演示

  数据源: window.HOLDINGS / window.TRADES / window.PRICE_HISTORY / window.SECURITIES
  复用: styles.css + mock-data.js(Task 5 已补 PRICE_HISTORY/TRADES)
  ============================================================================
-->
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg-deep); padding: 0; }
  .demo-shell { width: 1440px; margin: 24px auto; position: relative; }
  .nav-item.nav-perf { background: var(--gold); color: #fff; }
  .nav-item.nav-perf .icon, .nav-item.nav-perf .nav-cnt { color: #fff; }
</style>
</head>
<body>
<div class="demo-shell">
  <div class="desk-shell">
    <!-- ============ 侧栏 ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">御</div>
        <div class="brand-name">御财<span>·持仓</span></div>
      </div>
      <div class="nav-sec">
        <div class="nav-sec-label">持仓管理</div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>持仓列表<span class="nav-cnt">6</span></div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="m9 13 3 3 3-3"/></svg>交易 Sheet</div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>Security 管理</div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>持仓详情</div>
        <div class="nav-sec-label" style="margin-top:10px;">统计 &amp; 目标</div>
        <div class="nav-item nav-perf"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>收益统计</div>
        <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>投资目标</div>
      </div>
      <div class="sidebar-foot">v1.0 · 御财持仓 A-od</div>
    </aside>

    <!-- ============ 主区 ============ -->
    <main class="desk-main">
      <!-- 顶栏 -->
      <div class="topbar-d">
        <div class="tb-left">
          <h1>收益统计</h1>
          <div class="tb-sub">总收益走势 · realized/unrealized 分解 · 年化对比 · 持仓贡献</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="exportBtn"></button>
          <button class="btn btn-gold" id="refreshBtn"></button>
        </div>
      </div>

      <!-- ① 概览头 -->
      <section class="perf-header" id="perfHeader" style="margin-bottom:16px;"></section>

      <!-- ② 总收益曲线（全宽） -->
      <section class="curve-card perf-curve" id="curveCard" style="margin-bottom:16px;"></section>

      <!-- ③④ realized/unrealized + 年化收益率 两列 -->
      <section class="perf-grid-d-2">
        <div class="split-card" id="splitCard"></div>
        <div class="annual-card" id="annualCard"></div>
      </section>

      <!-- ⑤⑥ 持仓贡献 + 类型贡献 两列 -->
      <section class="perf-grid-d-2" style="margin-bottom:0;">
        <div class="contrib-card" id="contribHoldingCard"></div>
        <div class="contrib-card" id="contribTypeCard"></div>
      </section>

      <!-- API 标注 -->
      <div class="api-note">
        <span class="icon" id="apiNoteIcon"></span>
        <span class="an-badge">⏳ C</span>
        <span>收益 snapshot 表（日/月/年聚合）由 C 子项目实现；本页曲线/数字为前端从 ListHoldingTransactions + PRICE_HISTORY 聚合 mock，A-flutter 接 ⏳C snapshot 替换。</span>
      </div>

    </main>
  </div>
</div>

<script src="mock-data.js"></script>
<script>
(function () {
  var icon = window.icon;
  var fmtCNY = window.fmtCNY;
  var fmtPct = window.fmtPct;
  var fmtSigned = window.fmtSigned;

  /* 顶栏按钮 */
  document.getElementById('exportBtn').innerHTML  = icon('arrow-down-circle') + '导出';
  document.getElementById('refreshBtn').innerHTML = icon('refresh-cw') + '刷新';
  document.getElementById('apiNoteIcon').innerHTML = icon('info');
  document.querySelectorAll('#refreshBtn').forEach(function (b) {
    b.addEventListener('click', function () {
      b.classList.add('spinning');
      setTimeout(function () { b.classList.remove('spinning'); }, 1000);
    });
  });

  /* ============================================================
     聚合 helper：所有持仓合并的 realized/unrealized/total(CNY)
     ============================================================ */
  function aggregatePnl() {
    var realized = 0, unrealized = 0;
    window.HOLDINGS.forEach(function (h) {
      var br = window.holdingPnlBreakdown(h.id);
      realized   += window.toCNY(br.realized,   h.currency);
      unrealized += window.toCNY(br.unrealized, h.currency);
    });
    var total = realized + unrealized;
    var realizedPct = total !== 0 ? (realized / total) * 100 : 0;
    var unrealizedPct = total !== 0 ? (unrealized / total) * 100 : 0;
    return { realized: realized, unrealized: unrealized, total: total, realizedPct: realizedPct, unrealizedPct: unrealizedPct };
  }

  /* ============================================================
     ① 概览头
     ============================================================ */
  var agg = aggregatePnl();
  var sum = window.computeSummary();
  var totalUp = agg.total >= 0;
  document.getElementById('perfHeader').innerHTML =
      '<div class="ph-left">'
    +   '<span class="ph-label">' + icon('trending-up') + '总收益（CNY 折算 · 含已实现 + 浮动）</span>'
    +   '<span class="ph-value ' + (totalUp ? 'up' : 'down') + '">' + fmtSigned(agg.total, 'CNY').replace('+', '').replace('-', function (m) { return ''; }) + '</span>'
    +   '<span class="ph-sub">累计收益 · 总成本 ' + fmtCNY(sum.totalCostCNY) + ' <span class="ph-sep">·</span> 当前市值 ' + fmtCNY(sum.totalMktCNY) + '</span>'
    + '</div>'
    + '<div class="ph-right">'
    +   '<span class="ph-pill ' + (totalUp ? 'up' : 'down') + '">' + icon(totalUp ? 'trending-up' : 'trending-down') + fmtPct(sum.totalPnlPct) + '</span>'
    +   '<span class="ph-meta">截至 2026-05-31 · USD/CNY = 7.25</span>'
    + '</div>';

  /* ============================================================
     ② 总收益曲线（日/月/年 + 区间二级 tabs）
     —— 曲线 = 总市值(CNY) 随时间演变(各持仓 PRICE_HISTORY 同期汇总)
     ============================================================ */
  function buildTotalCurve(range) {
    /* 对齐各持仓同 range 的序列，按索引求和(CNY 折算) */
    var seriesBySec = window.HOLDINGS.map(function (h) {
      var sec = window.SECURITIES[h.security_id];
      var pts = (window.PRICE_HISTORY[sec.id] || {})[range] || [];
      return { h: h, sec: sec, pts: pts };
    });
    var maxLen = 0;
    seriesBySec.forEach(function (s) { if (s.pts.length > maxLen) maxLen = s.pts.length; });
    var total = [];
    for (var i = 0; i < maxLen; i++) {
      var sumV = 0, label = '';
      var any = false;
      seriesBySec.forEach(function (s) {
        if (s.pts[i]) {
          sumV += window.toCNY(s.pts[i].v * s.h.quantity, s.h.currency);
          label = s.pts[i].t;
          any = true;
        }
      });
      if (any) total.push({ t: label, v: sumV });
    }
    return total;
  }

  function applyRangeFilter(pts, rangeSec) {
    if (!rangeSec || rangeSec === 'ALL' || !pts.length) return pts;
    var n = pts.length;
    var take;
    if (rangeSec === '1M') take = Math.min(n, Math.round(n / 12) || 1);   /* 日线 30→~3 不合理,改用 1/12 比例 */
    else if (rangeSec === '3M') take = Math.min(n, Math.round(n / 4) || 1);
    else if (rangeSec === '6M') take = Math.min(n, Math.round(n / 2) || 1);
    else if (rangeSec === '1Y') take = Math.min(n, Math.round(n * 0.8) || 1);
    else take = n;
    /* 简化：1M/3M/6M 仅对日线有意义(30 点),月线 12 点全显,年线 5 点全显 */
    if (pts.length <= 12) return pts;
    return pts.slice(n - take);
  }

  function renderCurve(range, rangeSec) {
    range = range || 'D';
    rangeSec = rangeSec || 'ALL';
    var allPts = buildTotalCurve(range);
    var pts = applyRangeFilter(allPts, rangeSec);
    var curve = window.buildCurve(pts);
    var stroke = curve.up ? 'var(--up)' : 'var(--down)';
    var fill   = curve.up ? 'var(--up-soft)' : 'var(--down-soft)';
    var rangeLabel = range === 'D' ? '近 30 天' : range === 'M' ? '近 12 月' : '近 5 年';
    var firstLabel = pts.length ? pts[0].t : '—';
    var lastLabel  = pts.length ? pts[pts.length - 1].t : '—';
    var delta = pts.length >= 2 ? pts[pts.length - 1].v - pts[0].v : 0;
    var deltaPct = pts.length >= 2 && pts[0].v ? (delta / pts[0].v) * 100 : 0;

    var head =
        '<div class="curve-head perf-head">'
      +   '<div class="ch-title">'
      +     '<h3>总收益曲线</h3>'
      +     '<span class="ch-sub">' + rangeLabel + ' · 总市值(CNY 折算) · 区间 ' + fmtPct(deltaPct) + '</span>'
      +   '</div>'
      +   '<div class="range-row">'
      +     '<div class="range-tabs" id="rangeTabs">'
      +       '<button class="range-tab ' + (range === 'D' ? 'active' : '') + '" data-r="D">日</button>'
      +       '<button class="range-tab ' + (range === 'M' ? 'active' : '') + '" data-r="M">月</button>'
      +       '<button class="range-tab ' + (range === 'Y' ? 'active' : '') + '" data-r="Y">年</button>'
      +     '</div>'
      +     '<div class="range-secondary" id="rangeSec">'
      +       '<button class="range-sec-btn ' + (rangeSec === '1M'  ? 'active' : '') + '" data-s="1M">1M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '3M'  ? 'active' : '') + '" data-s="3M">3M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '6M'  ? 'active' : '') + '" data-s="6M">6M</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === '1Y'  ? 'active' : '') + '" data-s="1Y">1Y</button>'
      +       '<button class="range-sec-btn ' + (rangeSec === 'ALL' ? 'active' : '') + '" data-s="ALL">全部</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';

    var body = pts.length === 0
      ? '<div class="trades-empty" style="padding:30px 20px;"><div class="te-icon">' + icon('trending-up') + '</div><div class="te-title">暂无行情数据</div><div class="te-text">尚未接入行情源</div></div>'
      : '<div class="curve-body">'
        + '<svg class="curve-chart" viewBox="0 0 100 40" preserveAspectRatio="none">'
        +   '<defs><linearGradient id="cgPerf" x1="0" y1="0" x2="0" y2="1">'
        +     '<stop offset="0%" stop-color="' + fill + '" stop-opacity="0.7"/>'
        +     '<stop offset="100%" stop-color="' + fill + '" stop-opacity="0.1"/>'
        +   '</linearGradient></defs>'
        +   '<path d="' + curve.area + '" fill="url(#cgPerf)" stroke="none"/>'
        +   '<path d="' + curve.line + '" fill="none" stroke="' + stroke + '" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
        + '</svg>'
        + '<div class="curve-axis"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>'
        + '</div>';

    var foot =
        '<div class="curve-foot">'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:var(--gold)"></span>区间起点</span>'
        +     '<span class="cf-v mono">' + (pts.length ? fmtCNY(pts[0].v) : '—') + '</span></div>'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:' + stroke + '"></span>区间终点</span>'
        +     '<span class="cf-v mono ' + (curve.up ? 'up' : 'down') + '">' + (pts.length ? fmtCNY(pts[pts.length - 1].v) : '—') + '</span></div>'
        +   '<div class="cf-cell"><span class="cf-k"><span class="swatch" style="background:var(--fg-strong)"></span>区间变化</span>'
        +     '<span class="cf-v mono ' + (delta >= 0 ? 'up' : 'down') + '">' + fmtSigned(delta, 'CNY') + '<span class="cf-pct">' + fmtPct(deltaPct) + '</span></span></div>'
        + '</div>';

    document.getElementById('curveCard').innerHTML = head + body + foot;
    document.querySelectorAll('#rangeTabs .range-tab').forEach(function (b) {
      b.addEventListener('click', function () { renderCurve(b.dataset.r, rangeSec); });
    });
    document.querySelectorAll('#rangeSec .range-sec-btn').forEach(function (b) {
      b.addEventListener('click', function () { renderCurve(range, b.dataset.s); });
    });
  }
  renderCurve('D', 'ALL');

  /* ============================================================
     ③ realized / unrealized 分解
     ============================================================ */
  var realPos = agg.realized >= 0;
  var unreaPos = agg.unrealized >= 0;
  document.getElementById('splitCard').innerHTML =
      '<div class="split-head">'
    +   '<div class="sh-title"><h3>收益分解</h3><span class="ch-sub">已实现 + 未实现（CNY 折算）</span></div>'
    +   '<span class="api-badge proto"><span class="dot"></span>⏳ C snapshot</span>'
    + '</div>'
    + '<div class="split-body">'
    +   '<div class="split-bar">'
    +     '<div class="sb-realized"   style="width:' + Math.max(0, agg.realizedPct) + '%"></div>'
    +     '<div class="sb-unrealized ' + (unreaPos ? '' : 'down') + '" style="width:' + Math.max(0, agg.unrealizedPct) + '%"></div>'
    +   '</div>'
    +   '<div class="split-legend">'
    +     '<div class="sl-cell"><span class="sl-k"><span class="swatch" style="background:var(--gold)"></span>已实现（卖出+分红）</span>'
    +       '<span class="sl-v gold">' + fmtCNY(agg.realized) + '</span>'
    +       '<span class="sl-pct">占总收益 ' + agg.realizedPct.toFixed(1) + '%</span>'
    +     '</div>'
    +     '<div class="sl-cell"><span class="sl-k"><span class="swatch" style="background:' + (unreaPos ? 'var(--up)' : 'var(--down)') + '"></span>未实现（浮动盈亏）</span>'
    +       '<span class="sl-v ' + (unreaPos ? 'up' : 'down') + '">' + fmtCNY(agg.unrealized) + '</span>'
    +       '<span class="sl-pct">占总收益 ' + agg.unrealizedPct.toFixed(1) + '%</span>'
    +     '</div>'
    +     '<div class="sl-cell"><span class="sl-k"><span class="swatch" style="background:var(--fg-strong)"></span>合计</span>'
    +       '<span class="sl-v ' + (realPos && unreaPos ? 'up' : (agg.total >= 0 ? 'up' : 'down')) + '">' + fmtCNY(agg.total) + '</span>'
    +       '<span class="sl-pct">100%</span>'
    +     '</div>'
    +   '</div>'
    +   '<div class="split-desc">' + icon('info') + '已实现 = 卖出收入 - 卖出份额成本 + 累计分红；未实现 = 持仓量 × (现价 - 成本价)。</div>'
    + '</div>';

  /* ============================================================
     ④ 年化收益率 + 基准对比（mock）
     ============================================================ */
  /* mock 基准：沪深300 同期累计 +6.8% / 年化 +5.4% */
  var myAnnualized = 12.4;   /* mock：基于 agg.total/持仓时长推算（演示）*/
  var myCumulative = sum.totalPnlPct;
  var benchAnnualized = 5.4, benchCumulative = 6.8;
  var benchDelta = myAnnualized - benchAnnualized;
  document.getElementById('annualCard').innerHTML =
      '<div class="annual-head">'
    +   '<div class="ah-title"><h3>年化收益率</h3><span class="ah-sub">对比基准 沪深300 (000300.SH) · mock</span></div>'
    +   '<span class="api-badge proto"><span class="dot"></span>⏳ C snapshot</span>'
    + '</div>'
    + '<div class="annual-body">'
    +   '<div class="annual-row">'
    +     '<span class="ar-label">' + icon('percent') + '年化收益率</span>'
    +     '<span class="ar-val up">' + fmtPct(myAnnualized) + '</span>'
    +   '</div>'
    +   '<div class="annual-row">'
    +     '<span class="ar-label">' + icon('trending-up') + '累计收益率</span>'
    +     '<span class="ar-val ' + (myCumulative >= 0 ? 'up' : 'down') + '">' + fmtPct(myCumulative) + '</span>'
    +   '</div>'
    +   '<div class="bench-mini">'
    +     '<div class="bm-row"><span class="bm-label">我的组合</span>'
    +       '<div class="bm-track"><div class="bm-fill my pos" style="width:' + Math.min(50, Math.abs(myAnnualized)) + '%"></div><div class="bm-mid"></div></div>'
    +       '<span class="bm-val up">' + fmtPct(myAnnualized) + '</span>'
    +     '</div>'
    +     '<div class="bm-row"><span class="bm-label">沪深300</span>'
    +       '<div class="bm-track"><div class="bm-fill bench" style="width:' + Math.min(50, Math.abs(benchAnnualized)) + '%"></div><div class="bm-mid"></div></div>'
    +       '<span class="bm-val ' + (benchAnnualized >= 0 ? 'up' : 'down') + '">' + fmtPct(benchAnnualized) + '</span>'
    +     '</div>'
    +     '<div class="bm-row" style="margin-top:4px;font-size:11px;color:var(--muted);"><span class="bm-label">超额</span>'
    +       '<div class="bm-track" style="background:transparent;border:none;"></div>'
    +       '<span class="bm-val ' + (benchDelta >= 0 ? 'up' : 'down') + '">' + fmtPct(benchDelta) + '</span>'
    +     '</div>'
    +   '</div>'
    + '</div>';

  /* ============================================================
     ⑤ 按持仓贡献条
     ============================================================ */
  function contribScale(rows) {
    var max = 0;
    rows.forEach(function (r) { if (Math.abs(r.value) > max) max = Math.abs(r.value); });
    return max || 1;
  }
  function renderContribHolding() {
    var rows = window.HOLDINGS.map(function (h) {
      var sec = window.SECURITIES[h.security_id];
      var br = window.holdingPnlBreakdown(h.id);
      var total = window.toCNY(br.totalPnl, h.currency);
      return { id: h.id, sym: sec.symbol, name: sec.name, type: sec.type, value: total };
    }).sort(function (a, b) { return b.value - a.value; });
    var scale = contribScale(rows);
    var body = rows.map(function (r) {
      var meta = window.TYPE_META[r.type];
      var pct = (Math.abs(r.value) / scale) * 50; /* 中线起算最大 50% */
      return '<div class="contrib-row">'
        +   '<span class="cr-name"><span class="swatch" style="background:' + meta.color + '"></span><span class="cr-sym">' + r.sym + '</span><span class="cr-sub">' + meta.label + '</span></span>'
        +   '<div class="contrib-track"><div class="ct-mid"></div><div class="ct-fill ' + (r.value >= 0 ? 'pos' : 'neg') + '" style="width:' + pct + '%"></div></div>'
        +   '<span class="contrib-val ' + (r.value >= 0 ? 'up' : 'down') + '">' + fmtSigned(r.value, 'CNY') + '</span>'
        + '</div>';
    }).join('');
    document.getElementById('contribHoldingCard').innerHTML =
        '<div class="contrib-head"><div class="ch-title"><h3>按持仓贡献</h3><span class="ch-sub">每持仓盈亏（CNY 折算 · 正绿负红）</span></div></div>'
      + '<div class="contrib-body">' + body + '</div>';
  }

  /* ============================================================
     ⑥ 按类型贡献条
     ============================================================ */
  function renderContribType() {
    var byType = {};
    window.HOLDINGS.forEach(function (h) {
      var sec = window.SECURITIES[h.security_id];
      var br = window.holdingPnlBreakdown(h.id);
      var total = window.toCNY(br.totalPnl, h.currency);
      byType[sec.type] = (byType[sec.type] || 0) + total;
    });
    var rows = Object.keys(window.TYPE_META).map(function (t) {
      return { type: t, value: byType[t] || 0 };
    }).filter(function (r) { return r.value !== 0; }).sort(function (a, b) { return b.value - a.value; });
    var scale = contribScale(rows);
    var body = rows.length === 0
      ? '<div class="contrib-empty">' + icon('pie-chart') + '<div style="margin-top:6px;">暂无盈亏数据</div></div>'
      : rows.map(function (r) {
          var meta = window.TYPE_META[r.type];
          var pct = (Math.abs(r.value) / scale) * 50;
          return '<div class="contrib-row">'
            +   '<span class="cr-name"><span class="swatch" style="background:' + meta.color + '"></span><span class="cr-sym">' + meta.label + '</span></span>'
            +   '<div class="contrib-track"><div class="ct-mid"></div><div class="ct-fill ' + (r.value >= 0 ? 'pos' : 'neg') + '" style="width:' + pct + '%"></div></div>'
            +   '<span class="contrib-val ' + (r.value >= 0 ? 'up' : 'down') + '">' + fmtSigned(r.value, 'CNY') + '</span>'
            + '</div>';
        }).join('');
    document.getElementById('contribTypeCard').innerHTML =
        '<div class="contrib-head"><div class="ch-title"><h3>按类型贡献</h3><span class="ch-sub">按 type 聚合（stock/fund/etf/bond/gold）</span></div></div>'
      + '<div class="contrib-body">' + body + '</div>';
  }
  renderContribHolding();
  renderContribType();
})();
</script>
</body>
</html>
