<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>御财 · 移动端预算管理</title>
  <style>
    :root {
      --bg: #f7f6f2; --surface: #ffffff; --fg: #1a1916; --muted: #7a7770; --border: #e6e3dc; --accent: #b08d57;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --positive: #2d8a6e; --negative: #c4544d;
      --positive-bg: color-mix(in oklch, var(--positive) 10%, transparent);
      --negative-bg: color-mix(in oklch, var(--negative) 10%, transparent);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Noto Serif SC', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      --radius: 12px; --radius-lg: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

    .phone-frame { width: 390px; min-height: 844px; background: var(--bg); color: var(--fg); position: relative; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #333, 0 20px 60px rgba(0,0,0,0.4); }
    .dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 36px; background: #000; border-radius: 20px; z-index: 30; }
    .status-bar { height: 54px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
    .status-bar .time { font-family: var(--font-mono); }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { width: 16px; height: 16px; }

    .screen-content { height: 790px; overflow-y: auto; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }
    .screen-content::-webkit-scrollbar { display: none; }

    .mobile-header { padding: 8px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
    .mobile-header h1 { font-family: var(--font-display); font-size: 24px; }
    .header-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg); }
    .header-btn svg { width: 18px; height: 18px; }

    /* Month nav */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 20px;
      margin-bottom: 16px;
    }
    .month-arrow { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }
    .month-arrow svg { width: 14px; height: 14px; }
    .month-label { font-size: 15px; font-weight: 600; font-family: var(--font-display); }

    /* Overview ring */
    .budget-hero {
      margin: 0 20px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ring-wrap { width: 140px; height: 140px; position: relative; margin-bottom: 16px; }
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
    .ring-fill { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 113; }
    .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .ring-center .pct { font-family: var(--font-display); font-size: 32px; font-weight: 600; color: var(--accent); }
    .ring-center .pct-label { font-size: 11px; color: var(--muted); }
    .budget-hero .stats-row { display: flex; gap: 24px; }
    .budget-hero .stat { text-align: center; }
    .budget-hero .stat .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .budget-hero .stat .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }

    /* Budget category list */
    .budget-list { padding: 0 20px; }
    .budget-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }
    .budget-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .budget-cat { display: flex; align-items: center; gap: 10px; }
    .budget-cat .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .budget-cat .cat-name { font-size: 14px; font-weight: 500; }
    .budget-pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
    .budget-amounts { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .budget-amounts .spent { font-family: var(--font-mono); color: var(--fg); font-weight: 500; }
    .budget-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .budget-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: color-mix(in oklch, var(--surface) 95%, transparent); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 8px; z-index: 20; }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); cursor: pointer; }
    .tab-item.active { color: var(--accent); }
    .tab-item svg { width: 22px; height: 22px; }
    .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.2; }
  </style>
</head>
<body>

        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="18" height="12" rx="2"/><rect x="20" y="10" width="2" height="4" rx="1"/><rect x="4" y="8" width="8" height="2" rx="1" fill="var(--positive)"/></svg>
