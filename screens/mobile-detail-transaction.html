<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>御财 · 交易详情</title>
  <style>
    :root {
      --bg:      #f7f6f2;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #7a7770;
      --border:  #e6e3dc;
      --accent:  #b08d57;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --positive:    #2d8a6e;
      --negative:    #c4544d;
      --positive-bg: color-mix(in oklch, var(--positive) 10%, transparent);
      --negative-bg: color-mix(in oklch, var(--negative) 10%, transparent);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Noto Serif SC', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      --radius: 12px;
      --radius-lg: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

    .phone-frame { width: 390px; min-height: 844px; background: var(--bg); color: var(--fg); position: relative; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #333, 0 20px 60px rgba(0,0,0,0.4); }
    .dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 36px; background: #000; border-radius: 20px; z-index: 30; }
    .status-bar { height: 54px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
    .status-bar .time { font-family: var(--font-mono); }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { width: 16px; height: 16px; }

    .screen-content { height: 790px; overflow-y: auto; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
    .screen-content::-webkit-scrollbar { display: none; }

    .form-header { padding: 8px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
    .form-header h1 { font-family: var(--font-display); font-size: 22px; flex: 1; }
    .header-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }
    .header-btn svg { width: 18px; height: 18px; }

    /* Amount hero */
    .amount-hero {
      padding: 8px 20px 28px;
      text-align: center;
    }
    .amount-hero .amount {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 700;
      color: var(--negative);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .amount-hero .merchant {
      font-size: 16px;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 10px;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-positive { background: var(--positive-bg); color: var(--positive); }
    .amount-hero .datetime {
      font-size: 13px;
      color: var(--muted);
    }

    /* Detail card */
    .info-card {
      margin: 0 20px 16px;
      padding: 4px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .info-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 12px 16px 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 16px;
    }
    .info-row + .info-row { border-top: 1px solid var(--border); }
    .info-row .ir-label { font-size: 13px; color: var(--muted); flex-shrink: 0; }
    .info-row .ir-value { font-size: 13px; font-weight: 500; text-align: right; max-width: 60%; }

    /* Tags */
    .tags-section {
      padding: 0 20px 16px;
    }
    .tags-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag-pill {
      padding: 5px 14px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    /* Split details card */
    .split-card {
      margin: 0 20px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .split-card-header {
      padding: 12px 16px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .split-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 14px;
    }
    .split-item + .split-item { border-top: 1px solid var(--border); }
    .split-item .si-name { color: var(--fg); }
    .split-item .si-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
    .split-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 50%, var(--surface));
    }
    .split-total .si-name { font-size: 14px; font-weight: 700; }
    .split-total .si-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; color: var(--negative); }

    /* Section title */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      padding: 0 20px;
      margin-bottom: 10px;
    }

    /* Related transactions card */
    .related-card {
      margin: 0 20px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .related-item {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      text-decoration: none;
      color: var(--fg);
      cursor: pointer;
    }
    .related-item + .related-item { border-top: 1px solid var(--border); }
    .related-item .ri-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
    }
    .related-item .ri-date {
      font-size: 12px;
      color: var(--muted);
      margin-right: 8px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .related-item .ri-amount {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 600;
      color: var(--negative);
      margin-right: 8px;
    }
    .related-item .ri-chevron {
      color: var(--muted);
      flex-shrink: 0;
    }
    .related-item .ri-chevron svg { width: 16px; height: 16px; }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 32px;
      background: color-mix(in oklch, var(--surface) 95%, transparent);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      z-index: 20;
    }
    .btn-save {
      flex: 1;
      padding: 14px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-body);
      text-align: center;
      cursor: pointer;
    }
    .btn-cancel {
      padding: 14px 20px;
      border: 1px solid var(--negative);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--negative);
      background: transparent;
      font-family: var(--font-body);
      cursor: pointer;
    }

    .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.2; z-index: 25; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="17" y="4" width="4" height="16" rx="1"/><rect x="11" y="8" width="4" height="12" rx="1"/><rect x="5" y="12" width="4" height="8" rx="1"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="18" height="12" rx="2"/><rect x="20" y="10" width="2" height="4" rx="1"/><rect x="4" y="8" width="8" height="2" rx="1" fill="var(--positive)"/></svg>
      </div>
    </div>

    <div class="screen-content" data-od-id="mobile-detail-transaction">
      <!-- Header -->
      <div class="form-header">
        <a class="header-btn" href="mobile-transactions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1>交易详情</h1>
        <div style="width: 36px;"></div>
      </div>

      <!-- Amount hero -->
      <div class="amount-hero" data-od-id="amount-hero">
        <div class="amount">-¥2,680.00</div>
        <div class="merchant">望江楼私宴 · 家庭聚餐</div>
        <div class="badge-row">
          <span class="badge badge-positive">已完成</span>
        </div>
        <div class="datetime">2026年6月7日 18:30</div>
      </div>

      <!-- Detail card -->
      <div class="info-card" data-od-id="detail-info">
        <div class="info-card-title">交易信息</div>
        <div class="info-row">
          <span class="ir-label">类型</span>
          <span class="ir-value">支出</span>
        </div>
        <div class="info-row">
          <span class="ir-label">分类</span>
          <span class="ir-value">餐饮美食 &gt; 家庭聚餐</span>
        </div>
        <div class="info-row">
          <span class="ir-label">账户</span>
          <span class="ir-value">百夫长黑金卡 ···1008</span>
        </div>
        <div class="info-row">
          <span class="ir-label">交易对象</span>
          <span class="ir-value">望江楼私宴（陆家嘴中心店）</span>
        </div>
      </div>

      <!-- Tags -->
      <div class="tags-section" data-od-id="tags">
        <div class="tags-wrap">
          <span class="tag-pill">家庭</span>
          <span class="tag-pill">聚餐</span>
          <span class="tag-pill">商务宴请</span>
        </div>
      </div>

      <!-- Split details -->
      <div class="split-card" data-od-id="split-details">
        <div class="split-card-header">分单明细</div>
        <div class="split-item">
          <span class="si-name">包间费</span>
          <span class="si-amount">¥1,200</span>
        </div>
        <div class="split-item">
          <span class="si-name">菜品</span>
          <span class="si-amount">¥1,180</span>
        </div>
        <div class="split-item">
          <span class="si-name">茶水酒水</span>
          <span class="si-amount">¥300</span>
        </div>
        <div class="split-total">
          <span class="si-name">合计</span>
          <span class="si-amount">¥2,680</span>
        </div>
      </div>

      <!-- Related transactions -->
      <div class="section-title">同商户交易</div>
      <div class="related-card" data-od-id="related-transactions">
        <div class="related-item">
          <span class="ri-name">望江楼</span>
          <span class="ri-date">05/22</span>
          <span class="ri-amount">¥1,960</span>
          <span class="ri-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="related-item">
          <span class="ri-name">望江楼</span>
          <span class="ri-date">04/18</span>
          <span class="ri-amount">¥2,340</span>
          <span class="ri-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="related-item">
          <span class="ri-name">望江楼</span>
          <span class="ri-date">03/15</span>
          <span class="ri-amount">¥1,780</span>
          <span class="ri-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <button class="btn-save">编辑</button>
      <button class="btn-cancel">删除</button>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
